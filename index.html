  async function computeDuoStats() {
    const tournamentsSnap = await getDocs(query(collection(db, "tournaments"), where("format", "==", "tagteam"), where("status", "==", "completed")));
    const stats = {};
    tournamentsSnap.forEach(d => {
      const data = d.data();
      if (!data.teams || !data.winner || !data.runnerUp) return;
      const winTeam = data.teams.find(t => t.teamName === data.winner);
      const loseTeam = data.teams.find(t => t.teamName === data.runnerUp);
      if (winTeam && winTeam.members.length === 2) {
        stats[winTeam.teamName] = stats[winTeam.teamName] || { name: winTeam.teamName, wins: 0, losses: 0 };
        stats[winTeam.teamName].wins++;
      }
      if (loseTeam && loseTeam.members.length === 2) {
        stats[loseTeam.teamName] = stats[loseTeam.teamName] || { name: loseTeam.teamName, wins: 0, losses: 0 };
        stats[loseTeam.teamName].losses++;
      }
    });
    let best = null;
    Object.values(stats).forEach(s => { if (!best || s.wins > best.wins) best = s; });
    return { best };
  }

  async function computeFunRecords() {
    const tournamentsSnap = await getDocs(query(collection(db, "tournaments"), where("format", "==", "single"), where("status", "==", "completed")));
    let biggestScoring = null, biggestMargin = null;
    const cleanSheetCounts = {};
    const goldenBootCounts = {};

    tournamentsSnap.forEach(d => {
      const data = d.data();
      let matchList = [];
      if (data.finalScore) matchList.push({ sideA: data.participants[0].name, sideB: data.participants[1].name, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
      if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout) data.knockout.stages.forEach(stage => { matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

      matchList.forEach(m => {
        const total = m.scoreA + m.scoreB;
        const margin = Math.abs(m.scoreA - m.scoreB);
        const entry = { sideA: m.sideA, sideB: m.sideB, scoreA: m.scoreA, scoreB: m.scoreB, tournamentName: data.name };
        if (!biggestScoring || total > biggestScoring.total) biggestScoring = { ...entry, total };
        if (margin > 0 && (!biggestMargin || margin > biggestMargin.margin)) biggestMargin = { ...entry, margin };
        if (m.scoreB === 0) cleanSheetCounts[m.sideA] = (cleanSheetCounts[m.sideA] || 0) + 1;
        if (m.scoreA === 0) cleanSheetCounts[m.sideB] = (cleanSheetCounts[m.sideB] || 0) + 1;
      });

      const gb = computeGoldenBoot(data);
      if (gb) goldenBootCounts[gb.name] = (goldenBootCounts[gb.name] || 0) + 1;
    });

    let mostCleanSheets = null;
    Object.entries(cleanSheetCounts).forEach(([name, count]) => {
      if (!mostCleanSheets || count > mostCleanSheets.count) mostCleanSheets = { name, count };
    });

    let mostGoldenBoots = null;
    Object.entries(goldenBootCounts).forEach(([name, count]) => {
      if (!mostGoldenBoots || count > mostGoldenBoots.count) mostGoldenBoots = { name, count };
    });

    return { biggestScoring, biggestMargin, mostCleanSheets, mostGoldenBoots };
  }

  function findTeamByName(data, name) {
    return data.teams ? data.teams.find(t => t.teamName === name) : null;
  }

  async function computeDuoRankings() {
    const tournamentsSnap = await getDocs(query(collection(db, "tournaments"), where("format", "==", "tagteam"), where("subMode", "==", "multi"), where("status", "==", "completed")));
    const duoStats = {};

    function getEntry(team) {
      const key = team.members.map(x => x.name).slice().sort().join(" & ");
      if (!duoStats[key]) duoStats[key] = { name: team.teamName, wins: 0, draws: 0, losses: 0, champs: 0, runnerUps: 0 };
      return duoStats[key];
    }

    tournamentsSnap.forEach(d => {
      const data = d.data();
      if (!data.teams) return;

      let matchList = [];
      if (data.finalScore) matchList.push({ sideA: data.teams[0].teamName, sideB: data.teams[1].teamName, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2, penaltyA: data.finalScore.penalty1, penaltyB: data.finalScore.penalty2 });
      if (Array.isArray(data.matches)) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout && Array.isArray(data.knockout.stages)) {
        data.knockout.stages.forEach(stage => {
          matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
        });
      }

      matchList.forEach(m => {
        const teamA = findTeamByName(data, m.sideA), teamB = findTeamByName(data, m.sideB);
        if (!teamA || !teamB) return;
        const winnerName = matchWinnerName(m);
        if (!winnerName) {
          getEntry(teamA).draws++;
          getEntry(teamB).draws++;
          return;
        }
        const entryA = getEntry(teamA), entryB = getEntry(teamB);
        if (winnerName === m.sideA) { entryA.wins++; entryB.losses++; }
        else { entryB.wins++; entryA.losses++; }
      });

      if (data.winner && data.runnerUp) {
        const winTeam = findTeamByName(data, data.winner), loseTeam = findTeamByName(data, data.runnerUp);
        if (winTeam) getEntry(winTeam).champs++;
        if (loseTeam) getEntry(loseTeam).runnerUps++;
      }
    });

    return Object.values(duoStats)
      .map(d => {
        const matches = d.wins + d.draws + d.losses;
        return { ...d, matches, winPct: matches > 0 ? Math.round((d.wins / matches) * 100) : 0 };
      })
      .sort((a, b) => b.wins - a.wins || b.winPct - a.winPct || b.matches - a.matches);
  }

  const PLACEMENT_POINTS = { champion: 5, runnerUp: 3, semifinalist: 2, quarterfinalist: 1 };

  function matchWinnerName(m) {
    if (m.scoreA === m.scoreB) {
      if (m.penaltyA !== undefined) return m.penaltyA > m.penaltyB ? m.sideA : m.sideB;
      return null;
    }
    return m.scoreA > m.scoreB ? m.sideA : m.sideB;
  }

  async function computePlacementCounts() {
    const tournamentsSnap = await getDocs(query(collection(db, "tournaments"), where("format", "==", "single"), where("status", "==", "completed")));
    const counts = {};
    function bump(id, tier) {
      if (!id) return;
      if (!counts[id]) counts[id] = { champion: 0, runnerUp: 0, semifinalist: 0, quarterfinalist: 0 };
      counts[id][tier]++;
    }
    tournamentsSnap.forEach(d => {
      const data = d.data();
      if (!data.winner || !data.runnerUp) return;
      const winnerRef = sideRef(data, data.winner)[0];
      const runnerRef = sideRef(data, data.runnerUp)[0];
      if (winnerRef && winnerRef.type === "pool") bump(winnerRef.id, "champion");
      if (runnerRef && runnerRef.type === "pool") bump(runnerRef.id, "runnerUp");

      if (data.knockout) {
        const stages = data.knockout.stages;
        stages.forEach((stage, si) => {
          if (si === stages.length - 1) return;
          const tier = si === stages.length - 2 ? "semifinalist" : "quarterfinalist";
          stage.matches.forEach(m => {
            if (m.scoreA === null || m.scoreB === null) return;
            const winnerName = matchWinnerName(m);
            if (!winnerName) return;
            const loserName = winnerName === m.sideA ? m.sideB : m.sideA;
            const loserRef = sideRef(data, loserName)[0];
            if (loserRef && loserRef.type === "pool") bump(loserRef.id, tier);
          });
        });
      }
    });
    return counts;
  }

  /* 2. Streak Detection Engine (In-Form Fire / Ice Slump Auras) */
  async function refreshPlayerStreaks() {
    try {
      const snap = await getDocs(query(collection(db, "tournaments"), where("status", "==", "completed")));
      const allTournaments = [];
      snap.forEach(d => allTournaments.push(d.data()));
      allTournaments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      if (allTournaments.length === 0) return;

      const playerHistory = {};

      allTournaments.forEach(t => {
        const matches = [];

        if (t.finalScore) {
          const nameA = t.teams ? t.teams[0].teamName : (t.participants ? t.participants[0].name : "");
          const nameB = t.teams ? t.teams[1].teamName : (t.participants ? t.participants[1].name : "");
          if (nameA && nameB && t.finalScore.side1 !== null && t.finalScore.side2 !== null) {
            matches.push({ sideA: nameA, sideB: nameB, scoreA: t.finalScore.side1, scoreB: t.finalScore.side2 });
          }
        }
        if (Array.isArray(t.matches)) {
          matches.push(...t.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
        }
        if (t.knockout && Array.isArray(t.knockout.stages)) {
          t.knockout.stages.forEach(st => {
            if (Array.isArray(st.matches)) {
              matches.push(...st.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
            }
          });
        }

        matches.forEach(m => {
          const sideAPlayers = (m.sideA || "").split(" & ").map(s => s.trim()).filter(Boolean);
          const sideBPlayers = (m.sideB || "").split(" & ").map(s => s.trim()).filter(Boolean);
          const aWon = m.scoreA > m.scoreB;
          const bWon = m.scoreB > m.scoreA;

          sideAPlayers.forEach(name => {
            if (!name || name.startsWith("TBD")) return;
            const up = name.toUpperCase();
            if (!playerHistory[up]) playerHistory[up] = { matches: [] };
            playerHistory[up].matches.push({ win: aWon, loss: bWon });
          });

          sideBPlayers.forEach(name => {
            if (!name || name.startsWith("TBD")) return;
            const up = name.toUpperCase();
            if (!playerHistory[up]) playerHistory[up] = { matches: [] };
            playerHistory[up].matches.push({ win: bWon, loss: aWon });
          });
        });
      });

      window.__playerStreaksCache = {};
      Object.entries(playerHistory).forEach(([upName, pData]) => {
        const last3 = pData.matches.slice(-3);
        if (last3.length >= 3 && last3.every(h => h.win)) {
          window.__playerStreaksCache[upName] = "fire";
        } else if (last3.length >= 3 && last3.every(h => h.loss)) {
          window.__playerStreaksCache[upName] = "ice";
        }
      });
    } catch (e) {
      console.warn("Streaks refresh skipped:", e);
    }
  }

  setTimeout(() => refreshPlayerStreaks(), 1000);

  /* Gradual Digital Counter (3500ms Duration) */
  function runDigitalCounter(el, startVal, targetVal, duration = 3500) {
    if (!el) return;
    const startTime = performance.now();
    function step(now) {
      const elapsed = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - elapsed, 2.8);
      const cur = Math.round(startVal + (targetVal - startVal) * ease);
      el.textContent = cur + "%";
      if (elapsed < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  async function openFaceOffModal(sideA, sideB, matchLabel = "CHAMPIONSHIP FACE-OFF") {

    const ovrA = computePlayerOVR(sideA);

    const ovrDiff = ovrA - ovrB;
    const pElo = 1 / (1 + Math.pow(10, -ovrDiff / 14));

    let winsA = 0, winsB = 0, draws = 0, totalH2H = 0;
    try {
      const snap = await getDocs(collection(db, "tournaments"));
      snap.forEach(docSnap => {

        if (Array.isArray(t.matches)) matches.push(...t.matches);

          t.knockout.stages.forEach(st => { if (Array.isArray(st.matches)) matches.push(...st.matches); });
        }
        if (t.finalScore && t.teams) {
          matches.push({ sideA: t.teams[0].teamName, sideB: t.teams[1].teamName, scoreA: t.finalScore.side1, scoreB: t.finalScore.side2 });
        }

        matches.forEach(m => {
          if (m.scoreA === null || m.scoreB === null) return;
          const isA_B = (m.sideA === sideA && m.sideB === sideB);
          const isB_A = (m.sideA === sideB && m.sideB === sideA);
          if (!isA_B && !isB_A) return;

          totalH2H++;
          const scA = isA_B ? m.scoreA : m.scoreB;
          const scB = isA_B ? m.scoreB : m.scoreA;
          if (scA > scB) winsA++;
          else if (scB > scA) winsB++;
          else draws++;
        });
      });
    } catch (err) {}

    let pForm = 0.50;
    const streakA = window.__playerStreaksCache ? window.__playerStreaksCache[sideA.toUpperCase()] : null;

    if (streakB === "fire") pForm -= 0.12;
    if (streakB === "ice") pForm += 0.12;

    if (totalH2H >= 1) {
      const pH2H = (winsA + 1) / (winsA + winsB + 2);
      finalProbRatio = (pH2H * 0.55) + (pElo * 0.30) + (pForm * 0.15);
    } else {
      finalProbRatio = (pElo * 0.75) + (pForm * 0.25);
    }

    const probA = Math.round(Math.max(0.07, Math.min(0.93, finalProbRatio)) * 100);
    const probB = 100 - probA;

    const h2hTopHeadline = totalH2H > 0

              ${totalH2H > 0 ? `<span class="wins">(${winsA}W)</span>` : ''}
            </div>
            <div class="prob-center-tag">WIN PROBABILITY</div>
            <div class="player-prob-tag right">
              ${totalH2H > 0 ? `<span class="wins">(${winsB}W)</span>` : ''}

  /* 5. Web Audio Victory Fanfare */
  function playVictoryFanfare() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      if (ctx.state === "suspended") ctx.resume();

      const whistleOsc = ctx.createOscillator();
      const whistleGain = ctx.createGain();
      whistleOsc.type = "sine";
      whistleOsc.frequency.setValueAtTime(2850, ctx.currentTime);
      whistleOsc.frequency.exponentialRampToValueAtTime(3200, ctx.currentTime + 0.15);
      whistleGain.gain.setValueAtTime(0.2, ctx.currentTime);
      whistleGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      whistleOsc.connect(whistleGain);
      whistleGain.connect(ctx.destination);
      whistleOsc.start();
      whistleOsc.stop(ctx.currentTime + 0.23);

      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, ctx.currentTime + 0.2 + (i * 0.14));
        gain.gain.setValueAtTime(0, ctx.currentTime + 0.2 + (i * 0.14));
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.24 + (i * 0.14));
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.75 + (i * 0.14));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + 0.2 + (i * 0.14));
        osc.stop(ctx.currentTime + 0.8 + (i * 0.14));
      });
    } catch (e) {
      console.warn("Audio skipped:", e);
    }
  }

  /* 6. Fullscreen Particle Confetti */
  function launchConfetti() {
    let canvas = document.getElementById("confettiCanvas");
    if (!canvas) {
      canvas = document.createElement("canvas");
      canvas.id = "confettiCanvas";
      document.body.appendChild(canvas);
    }
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ["#00e676", "#00e5ff", "#ffd700", "#ff5252", "#e040fb", "#ffffff"];
    const pieces = Array.from({ length: 110 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height * 0.6,
      size: Math.random() * 8 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: Math.random() * 4 + 3,
      speedX: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 6
    }));

    let startTime = performance.now();
    function animate(now) {
      if (now - startTime > 3800) { canvas.remove(); return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

      ctx.fillText(`⚽ GOLDEN BOOT: ${goldenBoot.name} (${goldenBoot.goals} G)`, 540, 1528);
    }

    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.font = "700 28px monospace";
    ctx.fillText("OFFICIAL HUD ESPORTS BROADCAST • VERIFIED", 540, 1780);

    canvas.toBlob(async (blob) => {
      const fileName = `FC26_Story_${(data.name || "Tournament").replace(/\s+/g, "_")}.png`;
      const file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: data.name || "Tournament Champion",
            text: `👑 Champion: ${data.winner} | Runner-up: ${data.runnerUp}`
          });
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
        }
      }

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      showToast("Story graphic saved to Downloads!");
    }, "image/png");
  }

  /* NEXT UP CLASH ENGINE: COOLDOWNS, ROTATION & DRAW REEL     */
  /* ========================================================= */
  async function launchNextUpClash(tid, data, container, forcedGroup = null) {
    if (!currentAdmin) return;

    // Fetch fresh tournament data directly from Firestore so nextGroupPointer is never stale
    const snap = await getDoc(doc(db, "tournaments", tid));
    if (!snap.exists()) return;
    const freshData = snap.data();

    const unplayed = freshData.matches.filter(m => m.scoreA === null || m.scoreB === null);
    if (unplayed.length === 0) {
      showToast("All group stage matches have been played!", "info");
      return;
    }

    let candidatePool = [...unplayed];
    let chosenGroup = forcedGroup !== null ? forcedGroup : (freshData.nextGroupPointer ?? 0);

    // 1. Group Rotation Logic
    if (freshData.groups && freshData.groups.length > 1) {
      let groupMatches = candidatePool.filter(m => m.groupIndex === chosenGroup);

      // If active group has no unplayed matches left, cycle forward until we find one that does
      if (groupMatches.length === 0) {
        for (let step = 1; step <= freshData.groups.length; step++) {
          chosenGroup = (chosenGroup + 1) % freshData.groups.length;
          groupMatches = candidatePool.filter(m => m.groupIndex === chosenGroup);
          if (groupMatches.length > 0) break;
        }
      }
      if (groupMatches.length > 0) {
        candidatePool = groupMatches;
      }
    }

    // 2. Cooldown Filter (avoid picking players who just finished playing)
    const rested = data.lastDrawnPlayers || freshData.lastDrawnPlayers || [];
    let cooldownFiltered = candidatePool.filter(m => {
      const partsA = (m.sideA || "").split(" & ").map(s => s.trim());
      const partsB = (m.sideB || "").split(" & ").map(s => s.trim());
      const allInMatch = [...partsA, ...partsB];
      return !allInMatch.some(p => rested.includes(p));
    });

    const finalPool = cooldownFiltered.length > 0 ? cooldownFiltered : candidatePool;
    const chosenMatch = finalPool[Math.floor(Math.random() * finalPool.length)];

    showNextUpClashModal(tid, freshData, chosenMatch, container, chosenGroup);
  }

async function showNextUpClashModal(tid, data, match, container, activeGroupIndex) {
    const overlay = document.createElement("div");
    overlay.className = "faceoff-modal-overlay";

    const sideA = match.sideA;
    const sideB = match.sideB;

    // 1. Calculate Probability & Lifetime H2H
    const ovrA = computePlayerOVR(sideA);
    const ovrB = computePlayerOVR(sideB);
    const ovrDiff = ovrA - ovrB;
    const pElo = 1 / (1 + Math.pow(10, -ovrDiff / 14));

    let winsA = 0, winsB = 0, draws = 0, totalH2H = 0;
    try {
      const snap = await getDocs(collection(db, "tournaments"));
      snap.forEach(docSnap => {
        const t = docSnap.data();
        const matches = [];
        if (Array.isArray(t.matches)) matches.push(...t.matches);
        if (t.knockout && Array.isArray(t.knockout.stages)) {
          t.knockout.stages.forEach(st => { if (Array.isArray(st.matches)) matches.push(...st.matches); });
        }
        matches.forEach(m => {
          if (m.scoreA === null || m.scoreB === null) return;
          const isA_B = (m.sideA === sideA && m.sideB === sideB);
          const isB_A = (m.sideA === sideB && m.sideB === sideA);
          if (!isA_B && !isB_A) return;
          totalH2H++;
          const scA = isA_B ? m.scoreA : m.scoreB;
          const scB = isA_B ? m.scoreB : m.scoreA;
          if (scA > scB) winsA++;
          else if (scB > scA) winsB++;
          else draws++;
        });
      });
    } catch (err) {}

 function getSideMomentum(name) {
      if (!window.__playerStreaksCache) return 0;
      const parts = name.split(" & ").map(s => s.trim().toUpperCase());
      let delta = 0;
      parts.forEach(p => {
        const s = window.__playerStreaksCache[p];
        if (s === "fire") delta += 0.08;
        else if (s === "ice") delta -= 0.08;
      });
      return Math.max(-0.15, Math.min(0.15, delta));
    }

    const pForm = 0.50 + getSideMomentum(sideA) - getSideMomentum(sideB);

    const finalProbRatio = totalH2H >= 1
      ? ((((winsA + 1) / (winsA + winsB + 2)) * 0.55) + (pElo * 0.30) + (pForm * 0.15))
      : ((pElo * 0.75) + (pForm * 0.25));
    
    const probA = Math.round(Math.max(0.07, Math.min(0.93, finalProbRatio)) * 100);
    const probB = 100 - probA;

    const groupLabel = match.groupIndex !== null ? `GROUP ${match.groupIndex + 1}` : 'LEAGUE';
    const h2hTopHeadline = totalH2H > 0
      ? `${groupLabel} &bull; LIFETIME H2H: ${totalH2H} MATCH${totalH2H === 1 ? '' : 'ES'} (${draws} DRAWS)`
      : `${groupLabel} &bull; FIRST-TIME CLASH &bull; ELO RATED`;

    // 2. Build Stage Layout
    overlay.innerHTML = `
      <div class="faceoff-stage-container">
        <div class="faceoff-top-bar">
          <div class="title"><span class="live-pulse-dot" style="background:#00e676;"></span>⚔️ NEXT UP CLASH DRAW &bull; ${groupLabel}</div>
          <button class="faceoff-close-btn" id="clashModalClose">&times;</button>
        </div>

        <div class="arena-duel-zone">
          <div class="faceoff-vs-shield" id="clashVsShield" style="opacity:0; transform:translate(-50%, -50%) scale(0);">VS</div>
          <div class="card-slot left-fighter" id="reelSlotA">
            ${buildCyberEsportsCardHtml(sideA, "#4fffd2", "#4fffd2")}
          </div>
          <div class="card-slot right-fighter" id="reelSlotB">
            ${buildCyberEsportsCardHtml(sideB, "#ff5252", "#ff5252")}
          </div>
        </div>

        <!-- Animated Win Probability Bar -->
        <div class="cyber-prob-panel" id="clashProbPanel" style="opacity:0; transform:translateY(25px); transition:all 0.6s ease;">
          <div class="cyber-prob-meta">${h2hTopHeadline}</div>
          <div class="cyber-prob-labels">
            <div class="player-prob-tag left">
              <span class="name">${sideA}</span>
              ${totalH2H > 0 ? `<span class="wins">(${winsA}W)</span>` : ''}
            </div>
            <div class="prob-center-tag">WIN PROBABILITY</div>
            <div class="player-prob-tag right">
              ${totalH2H > 0 ? `<span class="wins">(${winsB}W)</span>` : ''}
              <span class="name">${sideB}</span>
            </div>
          </div>
          <div class="prob-digits-row">
            <div class="cyber-prob-num left" id="clashProbNumA">50%</div>
            <div class="cyber-prob-num right" id="clashProbNumB">50%</div>
          </div>
          <div class="cyber-prob-track-outer">
            <div class="cyber-prob-fill-left" id="clashProbBarA" style="width:50%;"></div>
            <div class="cyber-prob-fill-right" id="clashProbBarB" style="width:50%;"></div>
          </div>
        </div>

        <!-- Action Controls -->
        <div id="clashActionsBar" style="display:flex; justify-content:center; gap:12px; margin-top:14px; width:100%; opacity:0; transition:opacity 0.4s ease;">
          <button class="btn-initiate-clash" id="startClashMatchBtn" style="padding:10px 24px; font-size:15px;">▶ START MATCH</button>
          <button class="toggle-stage-btn" id="skipClashMatchBtn" style="margin:0; padding:10px 18px; font-size:13px; font-weight:bold;">⏭ SKIP TO NEXT GROUP</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    overlay.querySelector("#clashModalClose").addEventListener("click", () => overlay.remove());

    // 3. Slot Reel Animation
    const slotA = overlay.querySelector("#reelSlotA");
    const slotB = overlay.querySelector("#reelSlotB");
    const vsShield = overlay.querySelector("#clashVsShield");
    const probPanel = overlay.querySelector("#clashProbPanel");
    const actionsBar = overlay.querySelector("#clashActionsBar");

    const currentGroupMembers = data.groups && data.groups[match.groupIndex]
      ? data.groups[match.groupIndex].members
      : poolPlayers.map(p => p.name);

    let spinInterval = 75;
    let elapsed = 0;
    const totalSpinTime = 2200;

    function playReelTick() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.frequency.setValueAtTime(420, ctx.currentTime);
        g.gain.setValueAtTime(0.04, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    slotA.style.filter = "blur(4px)";
    slotB.style.filter = "blur(4px)";

    const reelTimer = setInterval(() => {
      elapsed += spinInterval;

      const randomA = currentGroupMembers[Math.floor(Math.random() * currentGroupMembers.length)];
      const randomB = currentGroupMembers[Math.floor(Math.random() * currentGroupMembers.length)];
      slotA.innerHTML = buildCyberEsportsCardHtml(randomA, "#4fffd2", "#4fffd2");
      slotB.innerHTML = buildCyberEsportsCardHtml(randomB, "#ff5252", "#ff5252");
      playReelTick();

      if (elapsed >= totalSpinTime) {
        clearInterval(reelTimer);

        slotA.style.filter = "none";
        slotB.style.filter = "none";
        slotA.innerHTML = buildCyberEsportsCardHtml(sideA, "#4fffd2", "#4fffd2");
        slotB.innerHTML = buildCyberEsportsCardHtml(sideB, "#ff5252", "#ff5252");

        vsShield.style.transition = "all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)";
        vsShield.style.opacity = "1";
        vsShield.style.transform = "translate(-50%, -50%) scale(1)";

        setTimeout(() => {
          probPanel.style.opacity = "1";
          probPanel.style.transform = "translateY(0)";
          actionsBar.style.opacity = "1";

          const barA = overlay.querySelector("#clashProbBarA");
          const barB = overlay.querySelector("#clashProbBarB");
          const probNumA = overlay.querySelector("#clashProbNumA");
          const probNumB = overlay.querySelector("#clashProbNumB");

          if (barA && barB) {
            barA.style.transition = "width 2.2s cubic-bezier(0.2, 0.8, 0.25, 1)";
            barB.style.transition = "width 2.2s cubic-bezier(0.2, 0.8, 0.25, 1)";
            barA.style.width = probA + "%";
            barB.style.width = probB + "%";
          }

          runDigitalCounter(probNumA, 50, probA, 2200);
          runDigitalCounter(probNumB, 50, probB, 2200);
        }, 350);
      }
    }, spinInterval);

    // Compute pointer for next rotation
    const totalGroups = data.groups ? data.groups.length : 1;
    const nextGroupIndex = (activeGroupIndex + 1) % totalGroups;

    // ⏭ SKIP DRAW: Advances immediately to the other group
    overlay.querySelector("#skipClashMatchBtn").addEventListener("click", async () => {
      overlay.remove();
      await updateDoc(doc(db, "tournaments", tid), { nextGroupPointer: nextGroupIndex });
      launchNextUpClash(tid, data, container, nextGroupIndex);
    });

    // ▶ START MATCH: Locks active match and updates next pointer for the match after this
    overlay.querySelector("#startClashMatchBtn").addEventListener("click", async () => {
      overlay.remove();
      await updateDoc(doc(db, "tournaments", tid), {
        activeClashMatchId: match.id,
        nextGroupPointer: nextGroupIndex
      });
      refreshTournamentCard(tid, container);
    });
  }
