<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root, [data-theme="matchday"] {
    --bg-page: linear-gradient(90deg, #e3ffe7 0%, #d9e7ff 100%);
    --bg-surface: #ffffff;
    --bg-surface-alt: #eef5f0;
    --text-primary: #16324f;
    --text-secondary: #46617d;
    --text-muted: #7891a8;
    --accent: #f2c94c;
    --accent-contrast: #16324f;
    --border: #cddfe0;
    --border-strong: #9fc2c5;
    --danger-bg: #6e2020;
    --danger-text: #ffb3b3;
    --success-bg: #d4f5dd;
    --success-text: #1a6b34;
    --font-heading: 'Oswald', Arial Narrow, sans-serif;
    --font-body: Arial, sans-serif;
    --radius-card: 10px;
    --heading-transform: uppercase;
    --heading-letter-spacing: 0.5px;
  }

  [data-theme="pitch"] {
    --bg-page: #f4ecd8;
    --bg-surface: #fbf6ea;
    --bg-surface-alt: #efe3c6;
    --text-primary: #3a2f1c;
    --text-secondary: #7a6a45;
    --text-muted: #9c8c66;
    --accent: #4a6b3a;
    --accent-contrast: #fbf6ea;
    --border: #d8c9a3;
    --border-strong: #b9a578;
    --danger-bg: #f3d9d0;
    --danger-text: #8a3a22;
    --success-bg: #e2ecd6;
    --success-text: #3c5a2c;
    --font-heading: Georgia, 'Times New Roman', serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --radius-card: 4px;
    --heading-transform: none;
    --heading-letter-spacing: normal;
  }

  [data-theme="hud"] {
    --bg-page: #14161a;
    --bg-surface: #1c1f26;
    --bg-surface-alt: #23272f;
    --text-primary: #eaf6ff;
    --text-secondary: #7fe6ff;
    --text-muted: #5b6472;
    --accent: #6fffb0;
    --accent-contrast: #14161a;
    --border: #2c313b;
    --border-strong: #3f4652;
    --danger-bg: #4a1f24;
    --danger-text: #ff8a8a;
    --success-bg: #163b2c;
    --success-text: #6fffb0;
    --font-heading: 'Consolas', 'Courier New', monospace;
    --font-body: 'Consolas', 'Courier New', monospace;
    --radius-card: 2px;
    --heading-transform: uppercase;
    --heading-letter-spacing: 1px;
  }

  body {
    font-family: var(--font-body);
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
    background: var(--bg-page);
    color: var(--text-primary);
    transition: background 0.2s ease, color 0.2s ease;
  }
  h1 { font-size: 22px; font-family: var(--font-heading); text-transform: var(--heading-transform); letter-spacing: var(--heading-letter-spacing); }
  h2 { font-size: 16px; margin-top: 20px; font-family: var(--font-heading); color: var(--text-primary); text-transform: var(--heading-transform); letter-spacing: var(--heading-letter-spacing); }
  h3 { font-size: 14px; margin: 10px 0 4px; color: var(--text-secondary); font-family: var(--font-heading); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  nav button { padding: 8px 12px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-card); cursor: pointer; font-size: 13px; font-family: var(--font-body); }
  nav button.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: bold; }
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px; margin-top: 12px; }
  .option-btn { padding: 9px 13px; font-size: 14px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-card); }
  .option-btn.selected { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  select, input[type=text], input[type=password], input[type=url], input[type=number] { padding: 7px; font-size: 14px; background: var(--bg-surface-alt); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-card); font-family: var(--font-body); }
  input[type=number] { width: 90px; }
  select { width: 100%; }
  label { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 8px; }
  button.primary { padding: 9px 14px; font-size: 14px; cursor: pointer; margin-top: 10px; background: var(--accent); color: var(--accent-contrast); border: none; border-radius: var(--radius-card); font-weight: bold; font-family: var(--font-body); }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--bg-surface-alt); border: 1px solid var(--border); padding: 5px 9px; border-radius: 14px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
  .chip button { border: none; background: none; cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  .guest-row { display: flex; gap: 6px; margin-top: 6px; }
  .guest-row input { flex: 1; }
  .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  th { color: var(--text-secondary); font-weight: normal; }
  .match-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0; }
  .match-row .name { font-size: 13px; font-weight: bold; width: 130px; text-align: center; font-family: var(--font-heading); color: var(--text-primary); }
  .match-row input { width: 46px; text-align: center; }
  .status-msg { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
  .warn { color: var(--danger-text); }
  .champ-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .champ-card { background: var(--bg-surface-alt); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 10px; text-align: center; }
  .champ-card .label { font-size: 10px; color: var(--text-muted); text-transform: var(--heading-transform); }
  .champ-card .name { font-size: 13px; font-weight: bold; margin-top: 3px; color: var(--accent); font-family: var(--font-heading); }
  .tab-row { display: flex; gap: 6px; margin-top: 10px; }
  .tab-row button { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-card); cursor: pointer; }
  .tab-row button.active { background: var(--accent); color: var(--accent-contrast); }
  .tourn-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat-card { background: var(--bg-surface-alt); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 8px 12px; }
  .stat-card .label { font-size: 11px; color: var(--text-muted); }
  .stat-card .value { font-size: 15px; font-weight: bold; color: var(--text-primary); }
  #winnerBanner { display: none; margin-top: 12px; padding: 12px; background: var(--success-bg); border-radius: 8px; font-weight: bold; color: var(--success-text); text-align: center; }
  .player-name-link { color: var(--accent); text-decoration: underline; cursor: pointer; background: none; border: none; font-size: 14px; padding: 0; font-family: var(--font-body); }

  .win-banner {
    position: relative;
    margin-top: 16px;
    padding: 22px 16px;
    border-radius: var(--radius-card);
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--bg-surface-alt) 80%);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    animation: winPop 0.55s cubic-bezier(.26,1.6,.4,1) both;
  }
  .win-banner .trophy {
    font-size: 34px;
    display: inline-block;
    animation: winBounce 1.1s ease-in-out infinite;
  }
  .win-banner .winName {
    font-size: 19px;
    font-weight: 800;
    color: var(--accent-contrast);
    font-family: var(--font-heading);
    text-transform: var(--heading-transform);
    margin-top: 4px;
  }
  .win-banner .winSub {
    font-size: 12px;
    color: var(--accent-contrast);
    opacity: 0.8;
    margin-top: 2px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 7px;
    height: 12px;
    opacity: 0.9;
    animation: confettiFall 1.6s ease-in forwards;
  }
  @keyframes winPop {
    0% { transform: scale(0.4) translateY(10px); opacity: 0; }
    60% { transform: scale(1.06) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes winBounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(160px) rotate(540deg); opacity: 0; }
  }

  .bracket-columns {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding: 8px 2px 14px;
    margin-top: 6px;
  }
  .bracket-col {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 14px;
    min-width: 150px;
    flex-shrink: 0;
  }
  .bracket-col h4 {
    font-size: 11px;
    text-transform: var(--heading-transform);
    letter-spacing: 0.5px;
    color: var(--text-muted);
    font-family: var(--font-heading);
    margin: 0 0 6px;
    text-align: center;
  }
  .bracket-match {
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--bg-surface-alt);
    padding: 8px;
    font-size: 12px;
  }
  .bracket-match .side {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }
  .bracket-match .side.winner-side {
    font-weight: bold;
    color: var(--accent);
  }
  .bracket-match .side-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }
  .bracket-match input[type=number] {
    width: 40px;
    padding: 3px;
    font-size: 12px;
  }
  .bracket-match button {
    margin-top: 4px;
    width: 100%;
    font-size: 11px;
    padding: 4px;
    cursor: pointer;
  }
  .bracket-final .bracket-match { border-color: var(--accent); }

  @media (max-width: 520px) {
    body { margin: 12px auto; padding: 0 12px; }
    h1 { font-size: 19px; }
    nav { gap: 5px; }
    nav button { padding: 7px 9px; font-size: 12px; }
    .teams-grid { grid-template-columns: 1fr; }
    .champ-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    .match-row { flex-wrap: wrap; gap: 6px; }
    .match-row .name { width: auto; flex-basis: 40%; }
    table { font-size: 12px; }
    th, td { padding: 5px 4px; }
    select, input[type=text], input[type=password], input[type=url], input[type=number] { width: 100%; }
    input[type=number] { width: 70px; }
  }
</style>
</head>
<body>

<h1>FC26 tracker</h1>
<div id="authBar" style="font-size:13px; color:var(--text-secondary);"></div>

<nav id="mainNav"></nav>

<div id="viewArea"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, setDoc,
    deleteDoc, increment, runTransaction, query, where, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp6Gyu5Se4uusmDR-qUi7HObPUvcLt32E",
    authDomain: "fcps5-tracker.firebaseapp.com",
    projectId: "fcps5-tracker",
    storageBucket: "fcps5-tracker.firebasestorage.app",
    messagingSenderId: "665004331085",
    appId: "1:665004331085:web:465607725bfda0068f8c04",
    measurementId: "G-DF7DCZ717Z"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentAdmin = null; // { username, active, isMaster }
  let currentView = "home";
  let poolPlayers = [];

  const authBar = document.getElementById("authBar");
  const mainNav = document.getElementById("mainNav");
  const viewArea = document.getElementById("viewArea");

  function usernameToEmail(u) { return u.trim().toLowerCase() + "@fc26tracker.app"; }
  function num(v) { return v || 0; }

  const THEMES = [
    { key: "matchday", label: "Matchday broadcast" },
    { key: "pitch", label: "Pitch programme" },
    { key: "hud", label: "Console HUD" }
  ];

  async function loadTheme() {
    try {
      const snap = await getDoc(doc(db, "settings", "theme"));
      const themeKey = snap.exists() ? snap.data().current : "matchday";
      document.documentElement.setAttribute("data-theme", themeKey);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "matchday");
    }
  }
  loadTheme();

  // ---------- Auth ----------
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
      const usernamePart = user.email.split("@")[0];
      const ref = doc(db, "admins", usernamePart);
      let snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { username: usernamePart.toUpperCase(), active: true, isMaster: usernamePart === "shaon", createdAt: Date.now() });
        snap = await getDoc(ref);
      }
      if (snap.data().active === false) {
        await signOut(auth);
        currentAdmin = null;
        authBar.textContent = "This admin account has been disabled.";
      } else {
        currentAdmin = { id: usernamePart, ...snap.data() };
        if (currentView === "login") currentView = "home";
        authBar.innerHTML = "Logged in as <strong>" + currentAdmin.username + "</strong> " +
          (currentAdmin.isMaster ? "(master admin) " : "") +
          "<button id='logoutBtn'>Log out</button>";
        document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));
      }
    } else {
      currentAdmin = null;
      authBar.innerHTML = "";
    }
    await loadPool();
    renderNav();
    renderView();
  });

  async function loadPool() {
    const snap = await getDocs(collection(db, "players"));
    poolPlayers = [];
    snap.forEach(d => poolPlayers.push({ id: d.id, ...d.data() }));
    poolPlayers.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  }

  async function nextGuestLabel() {
    const counterRef = doc(db, "counters", "guestPlayers");
    const next = await runTransaction(db, async (tx) => {
      const s = await tx.get(counterRef);
      const cur = s.exists() ? s.data().count : 0;
      tx.set(counterRef, { count: cur + 1 });
      return cur + 1;
    });
    return "GUEST PLAYER " + String(next).padStart(2, "0");
  }

  async function bump(playerId, fields) {
    const updates = {};
    Object.keys(fields).forEach(k => { if (fields[k]) updates[k] = increment(fields[k]); });
    if (Object.keys(updates).length === 0) return;
    await updateDoc(doc(db, "players", playerId), updates);
  }

  function showWinnerBanner(container, winnerName) {
    const banner = document.createElement("div");
    banner.className = "win-banner";
    const colors = ["#fff", "#ffe066", "#ff6b6b", "#4dd0e1", "#a3ff7a"];
    let confetti = "";
    for (let i = 0; i < 18; i++) {
      const left = Math.random() * 100;
      const delay = (Math.random() * 0.4).toFixed(2);
      const color = colors[i % colors.length];
      confetti += `<span class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s;"></span>`;
    }
    banner.innerHTML = confetti +
      "<div class='trophy'>\u{1F3C6}</div>" +
      "<div class='winSub'>Champion</div>" +
      "<div class='winName'>" + winnerName + "</div>";
    container.appendChild(banner);
  }

  // ---------- Nav ----------
  function renderNav() {
    const items = [
      { key: "home", label: "Home" },
      { key: "records", label: "Records" },
      { key: "playerPool", label: "Player pool" },
      { key: "liveTournaments", label: "Live tournaments" }
    ];
    if (currentAdmin) {
      items.push({ key: "createAdmin", label: "Create admin" });
      if (currentAdmin.isMaster) items.push({ key: "adminList", label: "Admin list" });
      items.push({ key: "createTournament", label: "Create tournament" });
    } else {
      items.push({ key: "login", label: "Admin login" });
    }
    mainNav.innerHTML = "";
    items.forEach(it => {
      const btn = document.createElement("button");
      btn.textContent = it.label;
      btn.className = currentView === it.key ? "active" : "";
      btn.addEventListener("click", () => { currentView = it.key; renderNav(); renderView(); });
      mainNav.appendChild(btn);
    });
  }

  function requireAdmin() {
    if (!currentAdmin) { viewArea.innerHTML = "<p class='warn'>You must be logged in as an admin to view this.</p>"; return false; }
    return true;
  }
  function requireMaster() {
    if (!currentAdmin || !currentAdmin.isMaster) { viewArea.innerHTML = "<p class='warn'>Only the master admin can view this.</p>"; return false; }
    return true;
  }

  function renderView() {
    if (currentView === "home") return renderHome();
    if (currentView === "records") return renderRecords();
    if (currentView === "login") return renderLogin();
    if (currentView === "createAdmin") return requireAdmin() && renderCreateAdmin();
    if (currentView === "adminList") return requireMaster() && renderAdminList();
    if (currentView === "createTournament") return requireAdmin() && renderCreateTournament();
    if (currentView === "liveTournaments") return renderLiveTournaments();
    if (currentView === "playerPool") return renderPlayerPool();
  }

  // ================= HOME =================
  async function renderHome() {
    viewArea.innerHTML = "<h2>Recent champions</h2><div class='champ-grid' id='champGrid'>Loading...</div>";
    const types = [
      { key: "single_none", label: "Single player" },
      { key: "tagteam_regular", label: "Tag-team regular" },
      { key: "tagteam_multi", label: "Tag-team multi" }
    ];
    const grid = document.getElementById("champGrid");
    grid.innerHTML = "";
    for (const t of types) {
      const snap = await getDoc(doc(db, "champions", t.key));
      const card = document.createElement("div");
      card.className = "champ-card";
      card.innerHTML = "<div class='label'>" + t.label + "</div><div class='name'>" + (snap.exists() ? snap.data().winner : "-") + "</div>";
      grid.appendChild(card);
    }
  }

  // ================= LOGIN =================
  function renderLogin() {
    viewArea.innerHTML = `
      <h2>Admin login</h2>
      <div class="card">
        <label>Username</label>
        <input type="text" id="loginUsername">
        <label>Password</label>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="password" id="loginPassword" style="flex:1;">
          <button type="button" id="togglePasswordBtn" style="padding:6px 10px; cursor:pointer;">&#128065;</button>
        </div>
        <br><button class="primary" id="loginBtn">Log in</button>
        <p class="status-msg" id="loginStatus"></p>
      </div>
    `;
    document.getElementById("togglePasswordBtn").addEventListener("click", () => {
      const input = document.getElementById("loginPassword");
      input.type = input.type === "password" ? "text" : "password";
    });
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value;
      const statusEl = document.getElementById("loginStatus");
      if (!u || !p) { statusEl.textContent = "Enter both fields."; return; }
      try {
        await signInWithEmailAndPassword(auth, usernameToEmail(u), p);
      } catch (e) {
        statusEl.textContent = "Login failed. Check your username and password.";
      }
    });
  }

  // ================= CREATE ADMIN =================
  function renderCreateAdmin() {
    viewArea.innerHTML = `
      <h2>Create a new admin</h2>
      <div class="card">
        <label>New admin username</label>
        <input type="text" id="newAdminUser">
        <label>New admin password (at least 6 characters)</label>
        <input type="password" id="newAdminPass">
        <br><button class="primary" id="createAdminBtn">Create admin</button>
        <p class="status-msg" id="createAdminStatus"></p>
      </div>
    `;
    document.getElementById("createAdminBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("createAdminStatus");
      const u = document.getElementById("newAdminUser").value.trim();
      const p = document.getElementById("newAdminPass").value;
      if (!u || !p) { statusEl.textContent = "Fill in both fields."; return; }
      if (p.length < 6) { statusEl.textContent = "Password must be at least 6 characters."; return; }
      const tempApp = initializeApp(firebaseConfig, "temp_" + Date.now());
      const tempAuth = getAuth(tempApp);
      try {
        await createUserWithEmailAndPassword(tempAuth, usernameToEmail(u), p);
        await signOut(tempAuth);
        await setDoc(doc(db, "admins", u.toLowerCase()), { username: u.toUpperCase(), active: true, isMaster: false, createdAt: Date.now() });
        statusEl.textContent = "Admin \"" + u.toUpperCase() + "\" created.";
      } catch (e) {
        statusEl.textContent = e.code === "auth/email-already-in-use" ? "That username is already taken." : "Failed: " + e.message;
      }
    });
  }

  // ================= ADMIN LIST =================
  async function renderAdminList() {
    viewArea.innerHTML = `
      <h2>All admins</h2>
      <p style='font-size:12px;color:var(--text-muted);'>"Delete" disables the account — it can no longer log in or take admin actions.</p>
      <table><thead><tr><th>Username</th><th>Status</th><th></th></tr></thead><tbody id='adminBody'></tbody></table>
      <div class="card">
        <h3>Site theme</h3>
        <p style="font-size:12px;color:var(--text-muted);">Changes how the site looks for everyone, not just you.</p>

  async function recalculateAllStats() {
    const statFields = ["singleMatchesPlayed", "singleGoalsFor", "singleGoalsAgainst", "singleWins", "singleLosses",
      "singleTournamentsPlayed", "singleChampionships", "singleRunnerUps",
      "tagTeamTournamentsPlayed", "tagTeamFinalWins", "tagTeamFinalLosses"];
    const deltas = {}; // playerId -> { field: total }
    function add(playerId, field, amount) {
      if (!playerId) return;
      if (!deltas[playerId]) deltas[playerId] = {};
      deltas[playerId][field] = (deltas[playerId][field] || 0) + amount;
    }

    const tournamentsSnap = await getDocs(collection(db, "tournaments"));
    tournamentsSnap.forEach(d => {
      const data = d.data();
      if (data.status !== "completed") return;

      const allMembers = data.format === "single" ? (data.participants || []) : (data.teams || []).flatMap(t => t.members);
      const participationField = data.format === "single" ? "singleTournamentsPlayed" : "tagTeamTournamentsPlayed";
      allMembers.forEach(m => { if (m.type === "pool") add(m.id, participationField, 1); });

      // gather every scored match played across this tournament's life (simple final, group stage, knockout stages)
      let matchList = [];
      if (data.finalScore) {
        const nameA = data.teams ? data.teams[0].teamName : data.participants[0].name;
        const nameB = data.teams ? data.teams[1].teamName : data.participants[1].name;
        matchList.push({ sideA: nameA, sideB: nameB, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
      }
      if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout) data.knockout.stages.forEach(stage => { matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

      if (data.format === "single") {
        matchList.forEach(m => {
          const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
          if (refA && refA.type === "pool") {
            add(refA.id, "singleMatchesPlayed", 1); add(refA.id, "singleGoalsFor", m.scoreA); add(refA.id, "singleGoalsAgainst", m.scoreB);
            add(refA.id, "singleWins", m.scoreA > m.scoreB ? 1 : 0); add(refA.id, "singleLosses", m.scoreA < m.scoreB ? 1 : 0);
          }
          if (refB && refB.type === "pool") {
            add(refB.id, "singleMatchesPlayed", 1); add(refB.id, "singleGoalsFor", m.scoreB); add(refB.id, "singleGoalsAgainst", m.scoreA);
            add(refB.id, "singleWins", m.scoreB > m.scoreA ? 1 : 0); add(refB.id, "singleLosses", m.scoreB < m.scoreA ? 1 : 0);
          }
        });
      }

      if (data.winner && data.runnerUp) {
        const winMembers = sideRef(data, data.winner), loseMembers = sideRef(data, data.runnerUp);
        winMembers.forEach(m => { if (m.type !== "pool") return; add(m.id, data.format === "single" ? "singleChampionships" : "tagTeamFinalWins", 1); });
        loseMembers.forEach(m => { if (m.type !== "pool") return; add(m.id, data.format === "single" ? "singleRunnerUps" : "tagTeamFinalLosses", 1); });
      }
    });

    const playersSnap = await getDocs(collection(db, "players"));
    for (const d of playersSnap.docs) {
      const reset = {};
      statFields.forEach(f => { reset[f] = 0; });
      Object.assign(reset, deltas[d.id] || {});
      await updateDoc(doc(db, "players", d.id), reset);
    }
    await loadPool();
  }

  async function exportRecords() {
    const statusEl = document.getElementById("exportStatus");
    statusEl.textContent = "Preparing export...";
    try {
      const collect = async (name) => {
        const snap = await getDocs(collection(db, name));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        return out;
      };
      const backup = {
        exportedAt: new Date().toISOString(),
        players: await collect("players"),
        tournaments: await collect("tournaments"),
        champions: await collect("champions"),
        resultsTable: await collect("resultsTable")
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = "fc26-records-backup-" + dateStr + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      statusEl.textContent = "Backup downloaded.";
    } catch (e) {
      statusEl.textContent = "Export failed: " + e.message;
    }
  }

    for (const d of championsSnap.docs) await deleteDoc(doc(db, "champions", d.id));

    const resultsSnap = await getDocs(collection(db, "resultsTable"));
    for (const d of resultsSnap.docs) await deleteDoc(doc(db, "resultsTable", d.id));

    const statFields = ["singleMatchesPlayed", "singleGoalsFor", "singleGoalsAgainst", "singleWins", "singleLosses",
      "singleTournamentsPlayed", "singleChampionships", "singleRunnerUps",
      "tagTeamTournamentsPlayed", "tagTeamFinalWins", "tagTeamFinalLosses"];
    const resetFields = {};
    statFields.forEach(f => { resetFields[f] = 0; });
    const playersSnap = await getDocs(collection(db, "players"));
    for (const d of playersSnap.docs) await updateDoc(doc(db, "players", d.id), resetFields);

    await setDoc(doc(db, "counters", "guestPlayers"), { count: 0 });
    await loadPool();
  }

  function todayNameFragment() {
    const now = new Date();
    const bd = new Date(now.getTime() + (6 * 60 * 60 * 1000 - now.getTimezoneOffset() * 60000));
    const day = bd.getDate();
    const month = bd.toLocaleString("en-US", { month: "short" });
    const year = bd.getFullYear();
    const suffix = (day % 10 === 1 && day !== 11) ? "st" : (day % 10 === 2 && day !== 12) ? "nd" : (day % 10 === 3 && day !== 13) ? "rd" : "th";
    return day + suffix + " " + month + " " + year;
  }
  function typeLabel() {
    if (sel.format === "single") return "Single Player Tournament";
    if (sel.format === "tagteam" && sel.subMode === "regular") return "Tag Team Regular Controller Tournament";
    if (sel.format === "tagteam" && sel.subMode === "multi") return "Tag Team Multiple Controller Tournament";
    return "";
  }
  function defaultTime() {
    if (sel.format === "single") return 10;
    if (sel.format === "tagteam" && sel.subMode === "multi") return 10;
    if (sel.format === "tagteam" && sel.subMode === "regular") return ({ 2: 20, 3: 30, 4: 40, 5: 40 })[sel.teamSize] || null;
    return null;
  }

      poolPlayers.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel2.appendChild(o); });
      sel2.addEventListener("change", () => {
        const t = parseInt(sel2.dataset.t, 10);

        if (regularTeams[0].some(m => m.id === sel2.value) || regularTeams[1].some(m => m.id === sel2.value)) { alert("That player is already on a team."); sel2.value = ""; return; }

        const p = poolPlayers.find(x => x.id === sel2.value);
        regularTeams[t].push({ type: "pool", id: p.id, name: p.name });
        sel2.value = ""; renderRegularChips(t);
      });
    });
    grid.querySelectorAll(".regGuestBtn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const t = parseInt(btn.dataset.t, 10);

        const input = grid.querySelector('.regGuestInput[data-t="' + t + '"]');
        const typed = input.value.trim();
        const label = typed ? typed.toUpperCase() : await nextGuestLabel();
        regularTeams[t].push({ type: "guest", id: null, name: label });
        input.value = ""; renderRegularChips(t);
      });
    });

  function renderRegularChips(t) {

  function buildMultiTeamBoxes() {

  function currentSideCount() {
    if (sel.format === "single") return singleParticipants.length;
    if (sel.subMode === "multi") return multiTeamCount;
    return 0;
  }
  function currentSideNames() {
    if (sel.format === "single") return singleParticipants.map(p => p.name);
    return multiTeams.filter(t => t.length === 2).map(t => t.map(m => m.name).join(" & "));
  }

  function maybeShowBracketConfig() {
    const bracketEl = document.getElementById("bracketConfigStep");
    const count = currentSideCount();
    if (count <= 2 || (sel.format === "tagteam" && multiTeams.some(t => t.length !== 2))) {
      bracketEl.style.display = "none"; bracketEl.innerHTML = ""; bracketStyle = null; groups = [];
      return;
    }
    bracketEl.style.display = "block";
    bracketEl.innerHTML = `
      <h3>5. Bracket style (${count} participants)</h3>

    document.getElementById("styleOptions").addEventListener("click", (e) => {

  function renderGroupConfig() {
    const area = document.getElementById("groupConfigArea");
    if (bracketStyle !== "group") { area.innerHTML = ""; return; }
    area.innerHTML = `
      <label>Number of groups</label>
      <input type="number" id="groupCountInput" min="2">

    `;
    document.getElementById("manualGroupBtn").addEventListener("click", () => setupGroups(false));
    document.getElementById("randomGroupBtn").addEventListener("click", () => setupGroups(true));

  function setupGroups(random) {
    const gc = parseInt(document.getElementById("groupCountInput").value, 10);
    const names = currentSideNames();
    if (!gc || gc < 2) { alert("Enter a valid number of groups."); return; }
    if (names.length % gc !== 0) { alert("Participant count (" + names.length + ") must divide evenly into " + gc + " groups."); return; }
    groupCount = gc;
    const perGroup = names.length / gc;
    if (random) {
      const shuffled = [...names].sort(() => Math.random() - 0.5);
      groups = Array.from({ length: gc }, (_, i) => shuffled.slice(i * perGroup, (i + 1) * perGroup));
      renderGroupsPreview(true, perGroup);
    } else {
      groups = Array.from({ length: gc }, () => []);
      renderGroupsPreview(false, perGroup);
    }
  }

  function renderGroupsPreview(readOnly, perGroup) {
    const preview = document.getElementById("groupsPreview");
    const names = currentSideNames();
    preview.innerHTML = "";
    groups.forEach((g, gi) => {
      const box = document.createElement("div"); box.className = "card";
      if (readOnly) {
        box.innerHTML = "<h3>Group " + (gi + 1) + "</h3>" + g.map(n => "<div>" + n + "</div>").join("");
      } else {
        box.innerHTML = "<h3>Group " + (gi + 1) + " (pick " + perGroup + ")</h3>";
        const s = document.createElement("select");
        s.innerHTML = '<option value="">-- add --</option>' + names.filter(n => !groups.some(gr => gr.includes(n))).map(n => "<option>" + n + "</option>").join("");
        s.addEventListener("change", () => {
          if (!s.value) return;
          if (groups[gi].length >= perGroup) { alert("Group " + (gi + 1) + " is full."); return; }
          groups[gi].push(s.value);
          renderGroupsPreview(false, perGroup);
        });
        box.appendChild(s);
        g.forEach((n, idx) => {
          const row = document.createElement("div");
          row.textContent = n + " ";
          const rm = document.createElement("button"); rm.textContent = "x";
          rm.addEventListener("click", () => { groups[gi].splice(idx, 1); renderGroupsPreview(false, perGroup); });
          row.appendChild(rm); box.appendChild(row);
        });
      }
      preview.appendChild(box);
    });
  }

  function roundRobinMatches(names) {
    const matches = [];
    for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) matches.push({ sideA: names[i], sideB: names[j], scoreA: null, scoreB: null });
    return matches;
  }

  async function saveTournament() {
    const statusEl = document.getElementById("createStatus");
    if (!sel.format) { statusEl.textContent = "Select a format."; return; }
    if (sel.format === "tagteam" && !sel.subMode) { statusEl.textContent = "Select a controller mode."; return; }
    if (sel.format === "tagteam" && sel.subMode === "regular" && !sel.teamSize) { statusEl.textContent = "Select a team size."; return; }
    if (!sel.time) { statusEl.textContent = "Set a match time."; return; }

    const base = { format: sel.format, subMode: sel.subMode, teamSize: sel.teamSize, matchTimeMinutes: sel.time, name: todayNameFragment() + " " + typeLabel(), createdAt: Date.now() };

    try {
      if (sel.format === "single") {
        if (singleParticipants.length < 2) { statusEl.textContent = "Add at least 2 participants."; return; }
        await finalizeAndSave(base, { participants: singleParticipants }, singleParticipants.map(p => p.name));
      } else if (sel.subMode === "regular") {
        if (regularTeams[0].length !== sel.teamSize || regularTeams[1].length !== sel.teamSize) { statusEl.textContent = "Both teams need exactly " + sel.teamSize + " member(s)."; return; }
        const teamData = regularTeams.map(t => ({ members: t, teamName: t.map(m => m.name).join(" & ") }));
        await addDoc(collection(db, "tournaments"), { ...base, teams: teamData, status: "ready" });
        statusEl.textContent = "Tournament created. Go to Live tournaments to play the match.";
      } else {
        if (!multiTeamCount || multiTeams.some(t => t.length !== 2)) { statusEl.textContent = "Set team count and fill every team with 2 members."; return; }
        const teamData = multiTeams.map(t => ({ members: t, teamName: t.map(m => m.name).join(" & ") }));
        await finalizeAndSave(base, { teamCount: multiTeamCount, teams: teamData }, teamData.map(t => t.teamName));
      }
    } catch (e) {
      statusEl.textContent = "Failed: " + e.message;
    }
  }

  async function finalizeAndSave(base, extra, names) {
    const statusEl = document.getElementById("createStatus");
    if (names.length === 2) {
      await addDoc(collection(db, "tournaments"), { ...base, ...extra, status: "ready" });
      statusEl.textContent = "Tournament created. Go to Live tournaments to play the match.";
      return;
    }
    if (!bracketStyle) { statusEl.textContent = "Choose a bracket style for " + names.length + " participants."; return; }
    let matches = [], groupsData = null;
    if (bracketStyle === "roundrobin") {
      matches = roundRobinMatches(names).map((m, i) => ({ ...m, id: "m" + i, groupIndex: null }));
    } else {
      if (!groups.length || groups.some(g => g.length !== names.length / groupCount)) { statusEl.textContent = "Finish assigning all groups first."; return; }
      groupsData = groups.map(g => ({ members: g }));
      let idx = 0;
      groups.forEach((g, gi) => { roundRobinMatches(g).forEach(m => { matches.push({ ...m, id: "m" + idx, groupIndex: gi }); idx++; }); });
    }
    await addDoc(collection(db, "tournaments"), { ...base, ...extra, bracketStyle, groups: groupsData, matches, status: "in-progress" });
    statusEl.textContent = "Tournament and matches created. Go to Live tournaments to enter scores.";
  }

  async function renderTournamentBody(container, tid, data) {
    if (data.status === "ready") {
      renderSimpleMatch(container, tid, data);
    } else if (data.status === "in-progress") {
      renderBracketBody(container, tid, data);
    }
  }

  function sideRef(data, name) {
    if (data.participants) { const p = data.participants.find(x => x.name === name); return p ? [{ id: p.id, type: p.type }] : []; }
    if (data.teams) { const t = data.teams.find(x => x.teamName === name); return t ? t.members.map(m => ({ id: m.id, type: m.type })) : []; }
    return [];
  }

  function renderSimpleMatch(container, tid, data) {
    const nameA = data.teams ? data.teams[0].teamName : data.participants[0].name;
    const nameB = data.teams ? data.teams[1].teamName : data.participants[1].name;

    if (!currentAdmin) {
      container.innerHTML = `
        <div class="match-row">
          <span class="name">${nameA}</span>
          <span>vs</span>
          <span class="name">${nameB}</span>
        </div>
        <p class="status-msg">Match not played yet.</p>
      `;
      return;
    }

    container.innerHTML = `
      <div class="match-row">
        <span class="name">${nameA}</span>
        <input type="number" min="0" id="s1_${tid}" value="0">
        <span>-</span>
        <input type="number" min="0" id="s2_${tid}" value="0">
        <span class="name">${nameB}</span>
      </div>
      <button class="primary" id="saveBtn_${tid}">Save result</button>
      <p class="status-msg" id="status_${tid}"></p>
    `;
    document.getElementById("saveBtn_" + tid).addEventListener("click", async (ev) => {

      const s2 = parseInt(document.getElementById("s2_" + tid).value, 10);
      const statusEl = document.getElementById("status_" + tid);
      if (isNaN(s1) || isNaN(s2) || s1 === s2 || s1 < 0 || s2 < 0) { statusEl.textContent = "Enter valid, non-tied scores."; return; }
      if (ev.target.disabled) return;
      ev.target.disabled = true;
      try {
        await finalizeTournament(tid, data, nameA, nameB, s1, s2);
        statusEl.textContent = "Result saved.";
        showWinnerBanner(container, s1 > s2 ? nameA : nameB);
        setTimeout(() => renderLiveTournaments(), 2200);
      } catch (e) { statusEl.textContent = "Failed: " + e.message; ev.target.disabled = false; }
    });
  }

  async function finalizeTournament(tid, data, nameA, nameB, s1, s2) {
    const winnerName = s1 > s2 ? nameA : nameB;
    const runnerUpName = s1 > s2 ? nameB : nameA;

    // per-match single-player stats
    if (data.format === "single") {
      const refA = sideRef(data, nameA)[0], refB = sideRef(data, nameB)[0];
      if (refA && refA.type === "pool") await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: s1, singleGoalsAgainst: s2, singleWins: s1 > s2 ? 1 : 0, singleLosses: s1 < s2 ? 1 : 0 });
      if (refB && refB.type === "pool") await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: s2, singleGoalsAgainst: s1, singleWins: s2 > s1 ? 1 : 0, singleLosses: s2 < s1 ? 1 : 0 });
    }

    // tournament-level participation + champion/runner-up (this IS the final since only 2 sides)
    const allMembers = data.format === "single" ? data.participants : data.teams.flatMap(t => t.members);
    for (const m of allMembers) {
      if (m.type !== "pool") continue;
      if (data.format === "single") await bump(m.id, { singleTournamentsPlayed: 1 });
      else await bump(m.id, { tagTeamTournamentsPlayed: 1 });
    }
    const winnerMembers = sideRef(data, winnerName), loserMembers = sideRef(data, runnerUpName);
    for (const m of winnerMembers) { if (m.type !== "pool") continue; if (data.format === "single") await bump(m.id, { singleChampionships: 1 }); else await bump(m.id, { tagTeamFinalWins: 1 }); }
    for (const m of loserMembers) { if (m.type !== "pool") continue; if (data.format === "single") await bump(m.id, { singleRunnerUps: 1 }); else await bump(m.id, { tagTeamFinalLosses: 1 }); }

    await updateDoc(doc(db, "tournaments", tid), { status: "completed", finalScore: { side1: s1, side2: s2 }, winner: winnerName, runnerUp: runnerUpName });
    await setDoc(doc(db, "champions", data.format + "_" + (data.subMode || "none")), { tournamentName: data.name, winner: winnerName, runnerUp: runnerUpName, updatedAt: Date.now() });
    await setDoc(doc(db, "resultsTable", tid), { format: data.format, subMode: data.subMode || null, tournamentName: data.name, winner: winnerName, runnerUp: runnerUpName, completedAt: Date.now() });
    await loadPool();
  }

  function computeStandings(sideNames, matches) {
    const stats = {};
    sideNames.forEach(n => { stats[n] = { name: n, played: 0, wins: 0, losses: 0, gf: 0, ga: 0 }; });
    matches.forEach(m => {
      if (m.scoreA === null || m.scoreB === null || !stats[m.sideA] || !stats[m.sideB]) return;
      stats[m.sideA].played++; stats[m.sideB].played++;
      stats[m.sideA].gf += m.scoreA; stats[m.sideA].ga += m.scoreB;
      stats[m.sideB].gf += m.scoreB; stats[m.sideB].ga += m.scoreA;
      if (m.scoreA > m.scoreB) { stats[m.sideA].wins++; stats[m.sideB].losses++; }
      else if (m.scoreB > m.scoreA) { stats[m.sideB].wins++; stats[m.sideA].losses++; }
    });
    return Object.values(stats).sort((a, b) => b.wins - a.wins || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  }

  function renderBracketBody(container, tid, data) {
    container.innerHTML = "";
    const knockoutStarted = !!data.knockout;

    const groupSection = document.createElement("div");
    const matchesDiv = document.createElement("div");
    matchesDiv.innerHTML = "<h3>Group / round-robin matches</h3>";
    data.matches.forEach((m, idx) => {
      const row = document.createElement("div");
      row.className = "match-row";
      if (!currentAdmin) {
        const scoreText = (m.scoreA !== null && m.scoreB !== null) ? (m.scoreA + " - " + m.scoreB) : "vs";
        row.innerHTML = `<span class="name">${m.sideA}</span><span>${scoreText}</span><span class="name">${m.sideB}</span>`;
      } else {
        row.innerHTML = `<span class="name">${m.sideA}</span><input type="number" min="0" value="${m.scoreA ?? ""}" data-idx="${idx}" data-side="A"><span>-</span><input type="number" min="0" value="${m.scoreB ?? ""}" data-idx="${idx}" data-side="B"><span class="name">${m.sideB}</span>`;
        const btn = document.createElement("button");
        btn.textContent = m.scoreA !== null ? "Update" : "Save";
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          btn.disabled = true;
          saveGroupMatch(tid, data, idx, container);
        });
        row.appendChild(btn);
      }
      matchesDiv.appendChild(row);
    });
    groupSection.appendChild(matchesDiv);

    const standingsDiv = document.createElement("div");
    if (data.groups) {
      data.groups.forEach((g, gi) => standingsDiv.appendChild(standingsTable("Group " + (gi + 1), computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi)))));
    } else {
      const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
      standingsDiv.appendChild(standingsTable("Standings", computeStandings(allNames, data.matches)));
    }
    groupSection.appendChild(standingsDiv);

    if (knockoutStarted) {
      groupSection.style.display = "none";
      const toggleBtn = document.createElement("button");
      toggleBtn.textContent = "Show group stage";
      toggleBtn.addEventListener("click", () => {
        const showing = groupSection.style.display !== "none";
        groupSection.style.display = showing ? "none" : "block";
        toggleBtn.textContent = showing ? "Show group stage" : "Hide group stage";
      });
      container.appendChild(toggleBtn);
    }
    container.appendChild(groupSection);

    const allGroupMatchesDone = data.matches.every(m => m.scoreA !== null && m.scoreB !== null);
    if (allGroupMatchesDone) {
      if (!data.knockout) {
        if (currentAdmin) {
          const setup = document.createElement("div");
          setup.className = "card";
          setup.innerHTML = "<h3>Set up knockout stage</h3><div class='options' id='koOptions_" + tid + "'><button class='option-btn' data-v='1'>Option 1: top teams straight to semis</button><button class='option-btn' data-v='2'>Option 2: with pre-semifinal knockouts</button></div><p class='status-msg' id='koStatus_" + tid + "'></p>";
          container.appendChild(setup);
          document.getElementById("koOptions_" + tid).addEventListener("click", async (e) => {
            if (!e.target.classList.contains("option-btn")) return;
            await generateKnockout(tid, data, parseInt(e.target.dataset.v, 10));
            refreshTournamentCard(tid, container);
          });
        } else {
          const waiting = document.createElement("p");
          waiting.className = "status-msg";
          waiting.textContent = "Group stage complete. Waiting for an admin to set up the knockout stage.";
          container.appendChild(waiting);
        }
      } else {
        renderKnockout(container, tid, data);
      }
    }
  }

  function standingsTable(title, rows) {
    const wrap = document.createElement("div");
    wrap.innerHTML = "<h3>" + title + "</h3><table><thead><tr><th>#</th><th>Name</th><th>P</th><th>W</th><th>L</th><th>GF</th><th>GA</th><th>GD</th></tr></thead><tbody></tbody></table>";
    const tbody = wrap.querySelector("tbody");
    rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + (i + 1) + "</td><td>" + r.name + "</td><td>" + r.played + "</td><td>" + r.wins + "</td><td>" + r.losses + "</td><td>" + r.gf + "</td><td>" + r.ga + "</td><td>" + (r.gf - r.ga) + "</td>";
      tbody.appendChild(tr);
    });
    return wrap;
  }

  async function saveGroupMatch(tid, data, idx, container) {
    const inputA = container.querySelector('input[data-idx="' + idx + '"][data-side="A"]');
    const inputB = container.querySelector('input[data-idx="' + idx + '"][data-side="B"]');
    const sA = parseInt(inputA.value, 10), sB = parseInt(inputB.value, 10);
    if (isNaN(sA) || isNaN(sB) || sA < 0 || sB < 0) { alert("Enter valid scores."); return; }
    const wasAlreadyScored = data.matches[idx].scoreA !== null;
    data.matches[idx].scoreA = sA; data.matches[idx].scoreB = sB;
    await updateDoc(doc(db, "tournaments", tid), { matches: data.matches });
    if (data.format === "single" && !wasAlreadyScored) {
      const refA = sideRef(data, data.matches[idx].sideA)[0], refB = sideRef(data, data.matches[idx].sideB)[0];
      if (refA && refA.type === "pool") await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: sA, singleGoalsAgainst: sB, singleWins: sA > sB ? 1 : 0, singleLosses: sA < sB ? 1 : 0 });
      if (refB && refB.type === "pool") await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: sB, singleGoalsAgainst: sA, singleWins: sB > sA ? 1 : 0, singleLosses: sB < sA ? 1 : 0 });
      await loadPool();
    }
    refreshTournamentCard(tid, container);
  }

  async function refreshTournamentCard(tid, container) {
    const snap = await getDoc(doc(db, "tournaments", tid));
    const fresh = snap.data();
    if (fresh.status === "completed") {
      container.innerHTML = "<p class='status-msg'>Completed. Winner: <strong>" + fresh.winner + "</strong></p>";
    } else {
      renderTournamentBody(container, tid, fresh);
    }
  }

  function seedQualifiers(data, option) {
    const grouped = !!data.groups;
    let direct = [], nextTier = [];
    if (grouped) {
      data.groups.forEach((g, gi) => {
        const standings = computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi));
        if (option === 1) direct.push(...standings.slice(0, 2));
        else { direct.push(standings[0]); nextTier.push(...standings.slice(1, 3)); }
      });
    } else {
      const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
      const standings = computeStandings(allNames, data.matches);
      if (option === 1) direct = standings.slice(0, 4);
      else { direct = standings.slice(0, 2); nextTier = standings.slice(2, 6); }
    }
    return { direct: direct.map(r => r.name), nextTier: nextTier.map(r => r.name) };
  }

  async function generateKnockout(tid, data, option) {
    const { direct, nextTier } = seedQualifiers(data, option);
    const stages = [];
    if (option === 2 && nextTier.length === 4) {
      stages.push({ name: "Pre-semifinal", matches: [
        { id: "p0", sideA: nextTier[0], sideB: nextTier[3], scoreA: null, scoreB: null },
        { id: "p1", sideA: nextTier[1], sideB: nextTier[2], scoreA: null, scoreB: null }
      ]});
      stages.push({ name: "Semifinal", matches: [
        { id: "s0", sideA: direct[0] || "TBD", sideB: "TBD (pre-semi winner)", scoreA: null, scoreB: null },
        { id: "s1", sideA: direct[1] || "TBD", sideB: "TBD (pre-semi winner)", scoreA: null, scoreB: null }
      ]});
    } else if (direct.length === 4) {
      stages.push({ name: "Semifinal", matches: [
        { id: "s0", sideA: direct[0], sideB: direct[3], scoreA: null, scoreB: null },
        { id: "s1", sideA: direct[1], sideB: direct[2], scoreA: null, scoreB: null }
      ]});
    } else {
      alert("Could not determine a clean 4-team knockout stage from the current standings — you may need to adjust group/team counts.");
      return;
    }
    stages.push({ name: "Final", matches: [ { id: "f0", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null } ] });
    await updateDoc(doc(db, "tournaments", tid), { knockout: { option, stages } });
  }

  function renderKnockout(container, tid, data) {
    const wrap = document.createElement("div");
    wrap.innerHTML = "<h3>Knockout stage</h3>";
    const columns = document.createElement("div");
    columns.className = "bracket-columns";

    data.knockout.stages.forEach((stage, si) => {
      const isFinalStage = si === data.knockout.stages.length - 1;
      const col = document.createElement("div");
      col.className = "bracket-col" + (isFinalStage ? " bracket-final" : "");
      col.innerHTML = "<h4>" + stage.name + "</h4>";

      stage.matches.forEach((m, mi) => {
        const box = document.createElement("div");
        box.className = "bracket-match";
        const bothKnown = !m.sideA.toString().startsWith("TBD") && !m.sideB.toString().startsWith("TBD");
        const decided = m.scoreA !== null && m.scoreB !== null;
        const aWon = decided && m.scoreA > m.scoreB;
        const bWon = decided && m.scoreB > m.scoreA;

        if (!currentAdmin || !bothKnown) {
          box.innerHTML =
            `<div class="side${aWon ? " winner-side" : ""}"><span class="side-name">${m.sideA}</span><span>${decided ? m.scoreA : ""}</span></div>` +
            `<div class="side${bWon ? " winner-side" : ""}"><span class="side-name">${m.sideB}</span><span>${decided ? m.scoreB : ""}</span></div>`;
        } else {
          box.innerHTML =
            `<div class="side${aWon ? " winner-side" : ""}"><span class="side-name">${m.sideA}</span><input type="number" min="0" value="${m.scoreA ?? ""}" data-stage="${si}" data-match="${mi}" data-side="A"></div>` +
            `<div class="side${bWon ? " winner-side" : ""}"><span class="side-name">${m.sideB}</span><input type="number" min="0" value="${m.scoreB ?? ""}" data-stage="${si}" data-match="${mi}" data-side="B"></div>`;
          const btn = document.createElement("button");
          btn.textContent = decided ? "Update" : "Save";
          btn.addEventListener("click", () => {
            if (btn.disabled) return;
            btn.disabled = true;
            saveKnockoutMatch(tid, data, si, mi, container);
          });
          box.appendChild(btn);
        }
        col.appendChild(box);
      });
      columns.appendChild(col);
    });

    wrap.appendChild(columns);
    container.appendChild(wrap);
  }

  async function saveKnockoutMatch(tid, data, si, mi, container) {
    const inputA = container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-side="A"]');
    const inputB = container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-side="B"]');
    const sA = parseInt(inputA.value, 10), sB = parseInt(inputB.value, 10);
    if (isNaN(sA) || isNaN(sB) || sA === sB || sA < 0 || sB < 0) { alert("Enter valid, non-tied scores."); return; }

    const stage = data.knockout.stages[si];
    const m = stage.matches[mi];
    const wasAlreadyScored = m.scoreA !== null;
    m.scoreA = sA; m.scoreB = sB;
    const winner = sA > sB ? m.sideA : m.sideB;

    if (wasAlreadyScored) {
      // Score is being corrected, not entered for the first time — update the number
      // only, since stats/champion/participation were already applied the first time.
      await updateDoc(doc(db, "tournaments", tid), { knockout: data.knockout });
      refreshTournamentCard(tid, container);
      return;
    }

    if (data.format === "single") {
      const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
      if (refA && refA.type === "pool") await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: sA, singleGoalsAgainst: sB, singleWins: sA > sB ? 1 : 0, singleLosses: sA < sB ? 1 : 0 });
      if (refB && refB.type === "pool") await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: sB, singleGoalsAgainst: sA, singleWins: sB > sA ? 1 : 0, singleLosses: sB < sA ? 1 : 0 });
      await loadPool();
    }

    // advance winner into next stage TBD slot
    if (si + 1 < data.knockout.stages.length) {
      const nextStage = data.knockout.stages[si + 1];
      const slot = nextStage.matches.find(nm => nm.sideA.toString().startsWith("TBD") || nm.sideB.toString().startsWith("TBD"));
      if (slot) { if (slot.sideA.toString().startsWith("TBD")) slot.sideA = winner; else slot.sideB = winner; }
    }

    const isFinal = si === data.knockout.stages.length - 1;
    await updateDoc(doc(db, "tournaments", tid), { knockout: data.knockout });

    if (isFinal) {
      const winnerName = winner, runnerUpName = winner === m.sideA ? m.sideB : m.sideA;
      const allMembers = data.format === "single" ? data.participants : data.teams.flatMap(t => t.members);
      for (const mem of allMembers) {
        if (mem.type !== "pool") continue;
        if (data.format === "single") await bump(mem.id, { singleTournamentsPlayed: 1 });
        else await bump(mem.id, { tagTeamTournamentsPlayed: 1 });
      }
      const winMembers = sideRef(data, winnerName), loseMembers = sideRef(data, runnerUpName);
      for (const mem of winMembers) { if (mem.type !== "pool") continue; if (data.format === "single") await bump(mem.id, { singleChampionships: 1 }); else await bump(mem.id, { tagTeamFinalWins: 1 }); }
      for (const mem of loseMembers) { if (mem.type !== "pool") continue; if (data.format === "single") await bump(mem.id, { singleRunnerUps: 1 }); else await bump(mem.id, { tagTeamFinalLosses: 1 }); }

      await updateDoc(doc(db, "tournaments", tid), { status: "completed", winner: winnerName, runnerUp: runnerUpName });
      await setDoc(doc(db, "champions", data.format + "_" + (data.subMode || "none")), { tournamentName: data.name, winner: winnerName, runnerUp: runnerUpName, updatedAt: Date.now() });
      await setDoc(doc(db, "resultsTable", tid), { format: data.format, subMode: data.subMode || null, tournamentName: data.name, winner: winnerName, runnerUp: runnerUpName, completedAt: Date.now() });
      await loadPool();
      showWinnerBanner(container, winnerName);
      setTimeout(() => refreshTournamentCard(tid, container), 2200);
      return;
    }

    refreshTournamentCard(tid, container);
  }

  // ================= RECORDS =================
  let recordsTab = "players";
  let viewingPlayerId = null;
  let viewingTournamentId = null;

  function renderRecords() {
    viewingPlayerId = null;
    viewingTournamentId = null;
    viewArea.innerHTML = `
      <h2>Records</h2>
      <div class="tab-row" id="recordsTabs">
        <button data-t="players">Players</button>
        <button data-t="tournaments">Tournaments</button>
      </div>
      <div id="recordsBody"></div>
    `;
    document.getElementById("recordsTabs").addEventListener("click", (e) => {
      if (!e.target.dataset.t) return;
      recordsTab = e.target.dataset.t;
      viewingPlayerId = null;
      viewingTournamentId = null;
      renderRecordsBody();
    });
    updateTabHighlight();
    renderRecordsBody();
  }
  function updateTabHighlight() {
    document.querySelectorAll("#recordsTabs button").forEach(b => b.classList.toggle("active", b.dataset.t === recordsTab));
  }

  async function renderRecordsBody() {
    updateTabHighlight();
    const body = document.getElementById("recordsBody");
    if (viewingPlayerId) return renderPlayerProfile(body, viewingPlayerId);
    if (viewingTournamentId) return renderTournamentDetail(body, viewingTournamentId);
    if (recordsTab === "players") return renderPlayersList(body);
    return renderTournamentRecords(body);
  }

  async function renderTournamentDetail(body, tid) {
    body.innerHTML = "<p>Loading...</p>";
    const snap = await getDoc(doc(db, "tournaments", tid));
    if (!snap.exists()) { body.innerHTML = "<button id='backToTournaments'>&larr; Back</button><p>Tournament not found.</p>"; document.getElementById("backToTournaments").addEventListener("click", () => { viewingTournamentId = null; renderRecordsBody(); }); return; }
    const data = snap.data();

    let html = "<button id='backToTournaments'>&larr; Back to tournaments</button><h2>" + data.name + "</h2>";
    if (data.winner) html += "<p class='status-msg'>Champion: <strong style='color:var(--accent);'>" + data.winner + "</strong> &middot; Runner-up: " + data.runnerUp + "</p>";
    body.innerHTML = html;
    document.getElementById("backToTournaments").addEventListener("click", () => { viewingTournamentId = null; renderRecordsBody(); });

    const contentDiv = document.createElement("div");
    body.appendChild(contentDiv);

    const hasGroupInfo = !!(data.groups || data.matches);
    if (hasGroupInfo) {
      const groupSection = document.createElement("div");
      groupSection.style.display = "none";
      if (data.groups) {
        data.groups.forEach((g, gi) => groupSection.appendChild(standingsTable("Group " + (gi + 1), computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi)))));
      } else if (data.matches) {
        const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
        groupSection.appendChild(standingsTable("Standings", computeStandings(allNames, data.matches)));
      }
      const toggleBtn = document.createElement("button");
      toggleBtn.textContent = "Show group stage";
      toggleBtn.style.marginTop = "10px";
      toggleBtn.addEventListener("click", () => {
        const showing = groupSection.style.display !== "none";
        groupSection.style.display = showing ? "none" : "block";
        toggleBtn.textContent = showing ? "Show group stage" : "Hide group stage";
      });
      contentDiv.appendChild(toggleBtn);
      contentDiv.appendChild(groupSection);
    }

    if (data.knockout) {
      renderKnockoutReadOnly(contentDiv, data);
    } else if (data.finalScore) {
      const nameA = data.teams ? data.teams[0].teamName : data.participants[0].name;
      const nameB = data.teams ? data.teams[1].teamName : data.participants[1].name;
      const box = document.createElement("div");
      box.className = "match-row";
      box.innerHTML = `<span class="name">${nameA}</span><span>${data.finalScore.side1} - ${data.finalScore.side2}</span><span class="name">${nameB}</span>`;
      contentDiv.appendChild(box);
    }
  }

  function renderKnockoutReadOnly(container, data) {
    const wrap = document.createElement("div");
    wrap.innerHTML = "<h3>Knockout stage</h3>";
    const columns = document.createElement("div");
    columns.className = "bracket-columns";
    data.knockout.stages.forEach((stage, si) => {
      const isFinalStage = si === data.knockout.stages.length - 1;
      const col = document.createElement("div");
      col.className = "bracket-col" + (isFinalStage ? " bracket-final" : "");
      col.innerHTML = "<h4>" + stage.name + "</h4>";
      stage.matches.forEach(m => {
        const decided = m.scoreA !== null && m.scoreB !== null;
        const aWon = decided && m.scoreA > m.scoreB;
        const bWon = decided && m.scoreB > m.scoreA;
        const box = document.createElement("div");
        box.className = "bracket-match";
        box.innerHTML =
          `<div class="side${aWon ? " winner-side" : ""}"><span class="side-name">${m.sideA}</span><span>${decided ? m.scoreA : ""}</span></div>` +
          `<div class="side${bWon ? " winner-side" : ""}"><span class="side-name">${m.sideB}</span><span>${decided ? m.scoreB : ""}</span></div>`;
        col.appendChild(box);
      });
      columns.appendChild(col);
    });
    wrap.appendChild(columns);
    container.appendChild(wrap);
  }

  function renderPlayersList(body) {
    body.innerHTML = "<div id='playersListInner'></div>";
    const inner = document.getElementById("playersListInner");
    poolPlayers.forEach(p => {
      const row = document.createElement("div");
      row.style.padding = "6px 0";
      const btn = document.createElement("button");
      btn.className = "player-name-link";
      btn.textContent = p.name;
      btn.addEventListener("click", () => { viewingPlayerId = p.id; renderRecordsBody(); });
      row.appendChild(btn);
      inner.appendChild(row);
    });
  }

  function renderPlayerProfile(body, playerId) {
    const p = poolPlayers.find(x => x.id === playerId);
    if (!p) { body.innerHTML = "<p>Player not found.</p>"; return; }
    const matches = num(p.singleMatchesPlayed), wins = num(p.singleWins);
    const winPct = matches > 0 ? Math.round((wins / matches) * 100) : 0;
    body.innerHTML = `
      <button id="backToPlayers">&larr; Back to players</button>
      <h2>${p.name}</h2>
      <h3>Tournament participation</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Single player tournaments</div><div class="value">${num(p.singleTournamentsPlayed)}</div></div>
        <div class="stat-card"><div class="label">Tag-team tournaments</div><div class="value">${num(p.tagTeamTournamentsPlayed)}</div></div>
        <div class="stat-card"><div class="label">Single player championships</div><div class="value">${num(p.singleChampionships)}</div></div>
        <div class="stat-card"><div class="label">Single player runner-ups</div><div class="value">${num(p.singleRunnerUps)}</div></div>
      </div>
      <h3>Single player match stats</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Matches played</div><div class="value">${matches}</div></div>
        <div class="stat-card"><div class="label">Win %</div><div class="value">${winPct}%</div></div>
        <div class="stat-card"><div class="label">Wins</div><div class="value">${num(p.singleWins)}</div></div>
        <div class="stat-card"><div class="label">Losses</div><div class="value">${num(p.singleLosses)}</div></div>
        <div class="stat-card"><div class="label">Goals scored</div><div class="value">${num(p.singleGoalsFor)}</div></div>
        <div class="stat-card"><div class="label">Goals against</div><div class="value">${num(p.singleGoalsAgainst)}</div></div>
      </div>
      <h3>Tag-team final results</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Final wins</div><div class="value">${num(p.tagTeamFinalWins)}</div></div>
        <div class="stat-card"><div class="label">Final losses</div><div class="value">${num(p.tagTeamFinalLosses)}</div></div>
      </div>
    `;
    document.getElementById("backToPlayers").addEventListener("click", () => { viewingPlayerId = null; renderRecordsBody(); });
  }

  async function renderTournamentRecords(body) {
    body.innerHTML = "<p>Loading...</p>";
    try {
      const resultsSnap = await getDocs(query(collection(db, "resultsTable"), where("format", "==", "single")));
      let topChampion = null, topRunnerUp = null, topScorer = null;
      poolPlayers.forEach(p => {
        if (!topChampion || num(p.singleChampionships) > num(topChampion.singleChampionships)) topChampion = p;
        if (!topRunnerUp || num(p.singleRunnerUps) > num(topRunnerUp.singleRunnerUps)) topRunnerUp = p;
        if (!topScorer || num(p.singleGoalsFor) > num(topScorer.singleGoalsFor)) topScorer = p;
      });
      const singleList = [];
      resultsSnap.forEach(d => singleList.push({ id: d.id, ...d.data() }));
      singleList.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
      let singleRows = singleList.map(r => "<tr data-tid='" + r.id + "'><td>" + r.tournamentName + "</td><td>" + r.winner + "</td><td>" + r.runnerUp + "</td><td><button class='detailsBtn' data-tid='" + r.id + "'>Details</button></td></tr>").join("");

      const regularSnap = await getDocs(query(collection(db, "resultsTable"), where("format", "==", "tagteam"), where("subMode", "==", "regular")));
      const regularList = []; regularSnap.forEach(d => regularList.push({ id: d.id, ...d.data() }));
      regularList.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
      let regularRows = regularList.map(r => "<tr data-tid='" + r.id + "'><td>" + r.tournamentName + "</td><td>" + r.winner + "</td><td>" + r.runnerUp + "</td><td><button class='detailsBtn' data-tid='" + r.id + "'>Details</button></td></tr>").join("");

      const multiSnap = await getDocs(query(collection(db, "resultsTable"), where("format", "==", "tagteam"), where("subMode", "==", "multi")));
      const multiList = []; multiSnap.forEach(d => multiList.push({ id: d.id, ...d.data() }));
      multiList.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
      let multiRows = multiList.map(r => "<tr data-tid='" + r.id + "'><td>" + r.tournamentName + "</td><td>" + r.winner + "</td><td>" + r.runnerUp + "</td><td><button class='detailsBtn' data-tid='" + r.id + "'>Details</button></td></tr>").join("");

      body.innerHTML = `
        <h3>Single player</h3>
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Total tournaments played</div><div class="value">${resultsSnap.size}</div></div>
          <div class="stat-card"><div class="label">Most-time champion</div><div class="value">${topChampion && num(topChampion.singleChampionships) > 0 ? topChampion.name + " (" + topChampion.singleChampionships + ")" : "-"}</div></div>
          <div class="stat-card"><div class="label">Most-time runner-up</div><div class="value">${topRunnerUp && num(topRunnerUp.singleRunnerUps) > 0 ? topRunnerUp.name + " (" + topRunnerUp.singleRunnerUps + ")" : "-"}</div></div>
          <div class="stat-card"><div class="label">Most goals scored</div><div class="value">${topScorer && num(topScorer.singleGoalsFor) > 0 ? topScorer.name + " (" + topScorer.singleGoalsFor + ")" : "-"}</div></div>
        </div>
        <table><thead><tr><th>Tournament</th><th>Winner</th><th>Runner-up</th><th></th></tr></thead><tbody>${singleRows || "<tr><td colspan=4>None yet.</td></tr>"}</tbody></table>

        <h3>Tag-team regular controller</h3>
        <table><thead><tr><th>Tournament</th><th>Winner</th><th>Runner-up</th><th></th></tr></thead><tbody>${regularRows || "<tr><td colspan=4>None yet.</td></tr>"}</tbody></table>

        <h3>Tag-team multiple controller</h3>
        <table><thead><tr><th>Tournament</th><th>Winner</th><th>Runner-up</th><th></th></tr></thead><tbody>${multiRows || "<tr><td colspan=4>None yet.</td></tr>"}</tbody></table>
      `;
      body.querySelectorAll(".detailsBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          viewingTournamentId = btn.dataset.tid;
          renderRecordsBody();
        });
      });
    } catch (e) {
      body.innerHTML = "<p class='warn'>Failed to load tournament records: " + e.message + "</p>";
    }
  }
</script>
