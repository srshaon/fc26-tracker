<style>
/* comment ==> 02. CSS Theme Variables starts from here */
  * { box-sizing: border-box; }

  :root, [data-theme="matchday"] {
    --bg-page: linear-gradient(90deg, #e3ffe7 0%, #d9e7ff 100%);
    --bg-surface: #ffffff;
    --bg-surface-alt: #eef5f0;
    --text-primary: #16324f;
    --text-secondary: #46617d;
    --text-muted: #7891a8;
    --accent: #f2c94c;
    --accent-contrast: #16324f;
    --border: #cddfe0;
    --border-strong: #9fc2c5;
    --danger-bg: #6e2020;
    --danger-text: #ffb3b3;
    --success-bg: #d4f5dd;
    --success-text: #1a6b34;
    --font-heading: 'Oswald', Arial Narrow, sans-serif;
    --font-body: Arial, sans-serif;
    --radius-card: 10px;
    --heading-transform: uppercase;
    --heading-letter-spacing: 0.5px;
  }

  [data-theme="pitch"] {
    --bg-page: #f4ecd8;
    --bg-surface: #fbf6ea;
    --bg-surface-alt: #efe3c6;
    --text-primary: #3a2f1c;
    --text-secondary: #7a6a45;
    --text-muted: #9c8c66;
    --accent: #4a6b3a;
    --accent-contrast: #fbf6ea;
    --border: #d8c9a3;
    --border-strong: #b9a578;
    --danger-bg: #f3d9d0;
    --danger-text: #8a3a22;
    --success-bg: #e2ecd6;
    --success-text: #3c5a2c;
    --font-heading: Georgia, 'Times New Roman', serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --radius-card: 4px;
    --heading-transform: none;
    --heading-letter-spacing: normal;
  }

  [data-theme="hud"] {
    --bg-page: #14161a;
    --bg-surface: #1c1f26;
    --bg-surface-alt: #23272f;
    --text-primary: #eaf6ff;
    --text-secondary: #7fe6ff;
    --text-muted: #5b6472;
    --accent: #6fffb0;
    --accent-contrast: #14161a;
    --border: #2c313b;
    --border-strong: #3f4652;
    --danger-bg: #4a1f24;
    --danger-text: #ff8a8a;
    --success-bg: #163b2c;
    --success-text: #6fffb0;
    --font-heading: 'Consolas', 'Courier New', monospace;
    --font-body: 'Consolas', 'Courier New', monospace;
    --radius-card: 2px;
    --heading-transform: uppercase;
    --heading-letter-spacing: 1px;
  }
/* comment ==> 02. CSS Theme Variables ends here */

/* comment ==> 03. CSS Base Layout & Typography starts from here */
  body {
    font-family: var(--font-body);
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
    background: var(--bg-page);
    color: var(--text-primary);
    transition: background 0.2s ease, color 0.2s ease;
  }
  h1 { font-size: 22px; font-family: var(--font-heading); text-transform: var(--heading-transform); letter-spacing: var(--heading-letter-spacing); }
  h2 { font-size: 16px; margin-top: 20px; font-family: var(--font-heading); color: var(--text-primary); text-transform: var(--heading-transform); letter-spacing: var(--heading-letter-spacing); }
  h3 { font-size: 14px; margin: 10px 0 4px; color: var(--text-secondary); font-family: var(--font-heading); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  nav button { padding: 8px 12px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-card); cursor: pointer; font-size: 13px; font-family: var(--font-body); }
  nav button.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: bold; }
/* comment ==> 03. CSS Base Layout & Typography ends here */

/* comment ==> 04. CSS Components (Cards, Buttons, Inputs, Tables) starts from here */
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px; margin-top: 12px; }
  .option-btn { padding: 9px 13px; font-size: 14px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-card); }
  .option-btn.selected { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  select, input[type=text], input[type=password], input[type=url], input[type=number] { padding: 7px; font-size: 14px; background: var(--bg-surface-alt); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-card); font-family: var(--font-body); }
  input[type=number] { width: 90px; }
  select { width: 100%; }
  label { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 8px; }
  button.primary { padding: 9px 14px; font-size: 14px; cursor: pointer; margin-top: 10px; background: var(--accent); color: var(--accent-contrast); border: none; border-radius: var(--radius-card); font-weight: bold; font-family: var(--font-body); }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--bg-surface-alt); border: 1px solid var(--border); padding: 5px 9px; border-radius: 14px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
  .chip button { border: none; background: none; cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  .guest-row { display: flex; gap: 6px; margin-top: 6px; }
  .guest-row input { flex: 1; }
  .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  th { color: var(--text-secondary); font-weight: normal; }

  /* Dynamic Stadium Atmospheric Lighting */
  body { transition: background 0.4s ease, box-shadow 0.4s ease; }
  body.lighting-group { background: radial-gradient(circle at 50% -15%, rgba(0, 230, 118, 0.12) 0%, transparent 65%), var(--bg-page); }
  body.lighting-knockout { background: radial-gradient(circle at 50% -15%, rgba(0, 229, 255, 0.16) 0%, transparent 68%), var(--bg-page); }
  body.lighting-final { background: radial-gradient(circle at 50% -15%, rgba(255, 215, 0, 0.22) 0%, transparent 72%), var(--bg-page); }

  /* FUT Streaks */
  .fut-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 18px; border-radius: 3px; font-size: 10px; font-weight: 900;
    font-family: var(--font-heading); line-height: 1; margin-right: 4px; flex-shrink: 0;
    clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 50% 100%, 0% 75%);
  }
  .fut-gold { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #3d2c00; }
  .fut-silver { background: linear-gradient(135deg, #e0e0e0 0%, #9e9e9e 100%); color: #212121; }
  .fut-bronze { background: linear-gradient(135deg, #c79061 0%, #8d5524 100%); color: #2a1505; }

  .streak-fire .player-avatar-circle,
  .streak-fire .player-avatar-placeholder {
    border-color: #ff5722 !important; box-shadow: 0 0 0 2px #ff5722, 0 0 16px rgba(255, 87, 34, 0.75) !important;
    animation: fireBreath 2s ease-in-out infinite alternate;
  }
  @keyframes fireBreath {
    from { box-shadow: 0 0 0 2px #ff5722, 0 0 10px rgba(255, 87, 34, 0.5); }
    to { box-shadow: 0 0 0 2.5px #ff9800, 0 0 20px rgba(255, 152, 0, 0.9); }
  }

  .streak-ice .player-avatar-circle,
  .streak-ice .player-avatar-placeholder {
    border-color: #00e5ff !important; box-shadow: 0 0 0 2px #00e5ff, 0 0 14px rgba(0, 229, 255, 0.65) !important;
    animation: frostShiver 2.4s ease-in-out infinite alternate;
  }
  @keyframes frostShiver {
    from { box-shadow: 0 0 0 2px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); }
    to { box-shadow: 0 0 0 2.5px #80d8ff, 0 0 18px rgba(128, 216, 255, 0.85); }
  }
  .streak-icon { font-size: 11px; margin-left: 2px; vertical-align: middle; }

  /* Profile Screen Fixed 3D Card */
  .holo-card-stage {
    perspective: 1200px;
    display: flex;
    justify-content: center;
    margin: 16px 0 20px;
  }
  .holo-card {
    position: relative;
    width: 275px;
    height: 415px;
    border-radius: 20px;
    transform-style: preserve-3d;
    transform: rotateX(7deg) rotateY(-5deg);
    box-shadow: 18px 24px 45px rgba(0, 0, 0, 0.92), -4px -4px 18px rgba(255, 255, 255, 0.05), 0 0 25px rgba(0, 230, 118, 0.25);
    overflow: hidden;
    padding: 3px;
    display: flex;
    background: #06090e;
    user-select: none;
  }
  .holo-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 270deg,
      rgba(0, 230, 118, 0.3) 310deg,
      #00e676 335deg,
      #00e5ff 352deg,
      #ffffff 360deg
    );
    animation: liquidBorderSpin 3.5s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes liquidBorderSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .holo-card-glare {
    position: absolute;
    inset: 3px;
    border-radius: 17px;
    background: linear-gradient(128deg, transparent 20%, rgba(255, 0, 128, 0.32) 38%, rgba(0, 229, 255, 0.38) 49%, rgba(255, 235, 59, 0.42) 56%, transparent 72%);
    background-size: 180% 180%;
    background-position: 52% 48%;
    mix-blend-mode: color-dodge;
    pointer-events: none;
    z-index: 5;
    opacity: 0.72;
  }
  .holo-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 17px;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: radial-gradient(circle at 50% 18%, #16241a 0%, #0d1612 55%, #06090a 100%);
    z-index: 2;
    transform: translateZ(26px);
  }
  .holo-header-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 4px;
  }
  .holo-ovr-num {
    font-family: var(--font-heading);
    font-size: 32px;
    font-weight: 900;
    line-height: 0.9;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
  }
  .holo-pos-label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #8899a6;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .holo-stars-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
    transform: translateZ(40px);
  }
  .holo-star {
    font-size: 16px;
    color: #ffd700;
    line-height: 1;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
  }
  .holo-avatar-wrap {
    margin-top: -4px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: translateZ(32px);
  }
  .holo-avatar-wrap .player-avatar-circle {
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.4), 0 8px 18px rgba(0, 0, 0, 0.8) !important;
  }
  .holo-avatar-wrap .player-avatar-placeholder {
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.3), 0 8px 18px rgba(0, 0, 0, 0.8) !important;
  }
  .holo-player-name {
    font-family: var(--font-heading);
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffffff;
    text-transform: uppercase;
    text-align: center;
    border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
    width: 86%;
    padding-bottom: 5px;
    margin-top: 4px;
  }
  .holo-stats-grid {
    width: 94%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px 8px;
    margin-top: 4px;
    text-align: center;
    background: rgba(0, 0, 0, 0.45);
    padding: 8px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .holo-stat-item { display: flex; justify-content: center; align-items: baseline; gap: 4px; }
  .holo-stat-val { font-family: var(--font-heading); font-size: 14px; font-weight: 900; color: #ffffff; }
  .holo-stat-lbl { font-size: 10px; font-weight: 800; color: var(--accent); }

  /* Radar Spider Chart */
  .radar-card-wrap { text-align: center; margin: 14px 0 18px; position: relative; }
  #profileRadarCanvas { max-width: 100%; display: block; margin: 0 auto; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45)); }

  /* Tables, Badges, Steppers */
  table tbody tr.row-qual td:first-child { border-left: 4.5px solid #00e676; font-weight: 800; color: #00e676; }
  table tbody tr.row-qual { background: linear-gradient(90deg, rgba(0, 230, 118, 0.12) 0%, rgba(0, 230, 118, 0.02) 100%); }
  table tbody tr.row-elim td:first-child { border-left: 4.5px solid rgba(255, 82, 82, 0.7); font-weight: 800; color: #ff5252; }
  table tbody tr.row-elim { background: linear-gradient(90deg, rgba(255, 82, 82, 0.09) 0%, rgba(255, 82, 82, 0.01) 100%); }
  .qual-tag { display: inline-block; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 4px; margin-left: 5px; }
  .qual-tag-q { background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid rgba(0, 230, 118, 0.6); }
  .qual-tag-e { background: rgba(255, 82, 82, 0.18); color: #ff5252; border: 1px solid rgba(255, 82, 82, 0.5); }

  .scoreboard-capsule {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(0, 0, 0, 0.45); padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--border-strong); cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .scoreboard-capsule:hover { border-color: var(--accent); transform: scale(1.03); }
  .scoreboard-capsule .score-num { font-family: var(--font-heading); font-size: 17px; font-weight: 800; color: var(--text-primary); }
  .scoreboard-capsule .score-num.score-winner { color: var(--accent); }
  .scoreboard-capsule .score-num.score-loser { color: var(--text-muted); opacity: 0.6; }
  .scoreboard-capsule .score-divider { font-weight: 800; font-size: 14px; color: var(--text-muted); }
  .score-display.clickable { cursor: pointer; transition: color 0.2s ease; }
  .score-display.clickable:hover { color: var(--accent); }

  .stepper-wrap { display: inline-flex; align-items: center; background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
  .stepper-btn { width: 26px; height: 32px; background: var(--bg-surface-alt); color: var(--text-primary); border: none; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .stepper-btn:hover { background: var(--accent); color: var(--accent-contrast); }
  .stepper-wrap input[type=number] { width: 34px !important; height: 32px !important; border: none !important; background: transparent !important; text-align: center; font-weight: 800; font-size: 15px; color: var(--text-primary); padding: 0 !important; }

  .match-fixture .name.side-winner .player-avatar-circle,
  .match-fixture .name.side-winner .player-avatar-placeholder {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2.5px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 75%, transparent) !important;
    transform: scale(1.06);
  }
  .match-fixture .name.side-winner .side-name { font-weight: 800; }
  .match-fixture .name.side-loser { opacity: 0.55; filter: grayscale(25%); }

  .stage-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-surface-alt); border: 1px solid var(--border-strong);
    padding: 6px 14px; border-radius: 6px; font-family: var(--font-heading);
    font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--text-primary);
    margin: 14px 0 8px 0;
  }
  .stage-badge .live-pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .toggle-stage-btn {
    display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 6px 0;
    padding: 7px 16px; font-size: 12px; font-weight: 700; border-radius: 20px;
    background: var(--bg-surface-alt); color: var(--text-secondary); border: 1px solid var(--border-strong);
    cursor: pointer;
  }
  .toggle-stage-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .match-filter-bar { display: flex; align-items: center; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
  .filter-pill { padding: 5px 12px; font-size: 12px; font-weight: 700; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--bg-surface-alt); color: var(--text-secondary); cursor: pointer; }
  .filter-pill.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

  /* ========================================================= */
  /* CYBER ESPORTS CINEMATIC FACE-OFF MODAL & PROBABILITY BAR   */
  /* ========================================================= */
  .faceoff-modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 7, 12, 0.96);
    backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center;
    z-index: 99999; padding: 10px; animation: modalFadeIn 0.4s ease;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .faceoff-stage-container {
    position: relative; width: 100%; max-width: 980px;
    display: flex; flex-direction: column; align-items: center;
    perspective: 1200px; margin: auto;
  }

  .faceoff-top-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: rgba(6, 11, 16, 0.92); border: 1px solid rgba(79, 255, 210, 0.35);
    border-radius: 12px; padding: 10px 16px; margin-bottom: 8px;
  }
  .faceoff-top-bar .title {
    font-size: 13px; font-weight: 900; letter-spacing: 2px;
    color: #4fffd2; text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .faceoff-close-btn {
    background: none; border: none; font-size: 24px; font-weight: bold;
    color: #8fa5af; cursor: pointer; line-height: 1; transition: color 0.2s;
  }
  .faceoff-close-btn:hover { color: #ffffff; }

  /* Duel Arena Zone (Flex Container to prevent overlap) */
  .arena-duel-zone {
    position: relative; width: 100%; height: 450px;
    display: flex; align-items: center; justify-content: space-around;
    overflow: hidden;
  }
  .arena-backdrop {
    position: absolute; inset: 0; display: flex; pointer-events: none; opacity: 0.85; z-index: 0;
  }
  .backdrop-half.left {
    flex: 1; background: radial-gradient(circle at 20% 50%, rgba(79, 255, 210, 0.12) 0%, transparent 70%);
  }
  .backdrop-half.right {
    flex: 1; background: radial-gradient(circle at 80% 50%, rgba(255, 82, 82, 0.12) 0%, transparent 70%);
  }

  /* Responsive Card Slots */
  .card-slot {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    will-change: transform, opacity;
  }
  .card-slot.left-fighter {
    animation: slowSlideInLeft 3.2s cubic-bezier(0.12, 0.88, 0.22, 1) both;
  }
  .card-slot.right-fighter {
    animation: slowSlideInRight 3.2s cubic-bezier(0.12, 0.88, 0.22, 1) both;
  }

  @keyframes slowSlideInLeft {
    0% { transform: translateX(-240px) rotateY(18deg) scale(0.85); opacity: 0; filter: blur(8px); }
    40% { opacity: 0.6; filter: blur(3px); }
    100% { transform: translateX(0) rotateY(6deg) scale(1); opacity: 1; filter: blur(0); }
  }
  @keyframes slowSlideInRight {
    0% { transform: translateX(240px) rotateY(-18deg) scale(0.85); opacity: 0; filter: blur(8px); }
    40% { opacity: 0.6; filter: blur(3px); }
    100% { transform: translateX(0) rotateY(-6deg) scale(1); opacity: 1; filter: blur(0); }
  }

  /* Central VS Shield */
  .faceoff-vs-shield {
    position: absolute; top: 48%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle, #15222b 0%, #060a0d 100%);
    border: 2px solid #4fffd2;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 900;
    color: #4fffd2; z-index: 10;
    box-shadow: 0 0 25px rgba(79, 255, 210, 0.45);
    animation: vsPopIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 2.9s both;
  }

  .win-banner {

  function convertImageUrl(url) {
    if (!url) return url;
    const trimmed = url.trim();
    if (!trimmed.includes("drive.google.com")) return trimmed;
    try {
      let fileId = null;
      const pathMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (pathMatch) {
        fileId = pathMatch[1];
      } else {
        const u = new URL(trimmed);
        if (u.searchParams.get("id")) fileId = u.searchParams.get("id");
      }
      if (fileId) return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1000";
    } catch (e) {}
    return trimmed;

    const next = await runTransaction(db, async (tx) => {
      const s = await tx.get(counterRef);
      const cur = s.exists() ? s.data().count : 0;
      tx.set(counterRef, { count: cur + 1 });
      return cur + 1;

  function getPlayerImageByName(name) {
    if (!name) return null;
    const clean = name.trim().toUpperCase();
    const p = poolPlayers.find(x => (x.name || "").trim().toUpperCase() === clean);
    return p && (p.photoUrl || p.imageUrl) ? convertImageUrl(p.photoUrl || p.imageUrl) : null;

function computePlayerOVR(playerName) {
    if (!playerName || !poolPlayers || poolPlayers.length === 0) return 74;

    // Tag-Team Duo: calculate individual ratings and average them
    if (playerName.includes(" & ")) {
      const partners = playerName.split(" & ").map(s => s.trim()).filter(Boolean);
      if (partners.length > 0) {
        const sum = partners.reduce((acc, pName) => acc + computePlayerOVR(pName), 0);
        return Math.round(sum / partners.length);
      }
    }

    const p = poolPlayers.find(x => x.name.toUpperCase() === playerName.toUpperCase());
    if (!p) return 72;
    const played = p.singleMatchesPlayed || 0;
    if (played === 0) return 75;
    const winRate = (p.singleWins || 0) / played;
    const gdPerGame = ((p.singleGoalsFor || 0) - (p.singleGoalsAgainst || 0)) / played;
    const titles = p.singleChampionships || 0;
    let ovr = Math.round(70 + (winRate * 18) + (gdPerGame * 2.5) + (titles * 1.5));
    return Math.max(63, Math.min(95, ovr));
  }
 
  function renderFutBadge(name) {
    if (name.includes(" & ")) return "";
    const ovr = computePlayerOVR(name);
    const tier = ovr >= 83 ? "fut-gold" : (ovr >= 75 ? "fut-silver" : "fut-bronze");
    return `<span class="fut-badge ${tier}" title="FUT OVR: ${ovr}">${ovr}</span>`;

      img: getPlayerImageByName(pName),

  async function recalculateAllStats() {
    const statFields = ["singleMatchesPlayed", "singleGoalsFor", "singleGoalsAgainst", "singleWins", "singleDraws", "singleLosses",
      "singleTournamentsPlayed", "singleChampionships", "singleRunnerUps",
      "tagRegularTournamentsPlayed", "tagRegularChampionships", "tagRegularRunnerUps",
      "tagMultiTournamentsPlayed", "tagMultiChampionships", "tagMultiRunnerUps",
      "tagMultiMatchesPlayed", "tagMultiWins", "tagMultiLosses"];
    const deltas = {};
    function add(playerId, field, amount) {
      if (!playerId) return;
      if (!deltas[playerId]) deltas[playerId] = {};
      deltas[playerId][field] = (deltas[playerId][field] || 0) + amount;
    }

    const tournamentsSnap = await getDocs(collection(db, "tournaments"));
    tournamentsSnap.forEach(d => {
      const data = d.data();
      if (data.status !== "completed") return;

      const allMembers = data.format === "single" ? (data.participants || []) : (data.teams || []).flatMap(t => t.members);
      const prefix = tagPrefix(data.subMode);
      const participationField = data.format === "single" ? "singleTournamentsPlayed" : (prefix + "TournamentsPlayed");
      allMembers.forEach(m => { if (m.type === "pool") add(m.id, participationField, 1); });

      let matchList = [];
      if (data.finalScore) {
        const nameA = data.teams ? data.teams[0].teamName : data.participants[0].name;
        const nameB = data.teams ? data.teams[1].teamName : data.participants[1].name;
        matchList.push({ sideA: nameA, sideB: nameB, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
      }
      if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout) data.knockout.stages.forEach(stage => { matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

      if (data.format === "single") {
        matchList.forEach(m => {
          const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
          if (refA && refA.type === "pool") {
            add(refA.id, "singleMatchesPlayed", 1); add(refA.id, "singleGoalsFor", m.scoreA); add(refA.id, "singleGoalsAgainst", m.scoreB);
            add(refA.id, "singleWins", m.scoreA > m.scoreB ? 1 : 0); add(refA.id, "singleDraws", m.scoreA === m.scoreB ? 1 : 0); add(refA.id, "singleLosses", m.scoreA < m.scoreB ? 1 : 0);
          }
          if (refB && refB.type === "pool") {
            add(refB.id, "singleMatchesPlayed", 1); add(refB.id, "singleGoalsFor", m.scoreB); add(refB.id, "singleGoalsAgainst", m.scoreA);
            add(refB.id, "singleWins", m.scoreB > m.scoreA ? 1 : 0); add(refB.id, "singleDraws", m.scoreA === m.scoreB ? 1 : 0); add(refB.id, "singleLosses", m.scoreB < m.scoreA ? 1 : 0);
          }
        });
      } else if (data.subMode === "multi") {
        matchList.forEach(m => {
          const winnerOfMatch = matchWinnerName(m);
          if (!winnerOfMatch) return;
          const sideAWon = winnerOfMatch === m.sideA;
          sideRef(data, m.sideA).forEach(mem => { if (mem.type === "pool") { add(mem.id, "tagMultiMatchesPlayed", 1); add(mem.id, "tagMultiWins", sideAWon ? 1 : 0); add(mem.id, "tagMultiLosses", sideAWon ? 0 : 1); } });
          sideRef(data, m.sideB).forEach(mem => { if (mem.type === "pool") { add(mem.id, "tagMultiMatchesPlayed", 1); add(mem.id, "tagMultiWins", sideAWon ? 0 : 1); add(mem.id, "tagMultiLosses", sideAWon ? 1 : 0); } });
        });
      }

      if (data.winner && data.runnerUp) {
        const winMembers = sideRef(data, data.winner), loseMembers = sideRef(data, data.runnerUp);
        winMembers.forEach(m => { if (m.type !== "pool") return; add(m.id, data.format === "single" ? "singleChampionships" : (prefix + "Championships"), 1); });
        loseMembers.forEach(m => { if (m.type !== "pool") return; add(m.id, data.format === "single" ? "singleRunnerUps" : (prefix + "RunnerUps"), 1); });
      }
    });

    const playersSnap = await getDocs(collection(db, "players"));
    for (const d of playersSnap.docs) {
      const reset = {};
      statFields.forEach(f => { reset[f] = 0; });
      Object.assign(reset, deltas[d.id] || {});
      await updateDoc(doc(db, "players", d.id), reset);
    }
    await loadPool();
    tournamentRecordsCache = null;
  }

  async function exportRecords() {
    const statusEl = document.getElementById("exportStatus");
    statusEl.textContent = "Preparing export...";
    try {
      const collect = async (name) => {
        const snap = await getDocs(collection(db, name));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        return out;
      };
      const backup = {
        exportedAt: new Date().toISOString(),
        players: await collect("players"),
        tournaments: await collect("tournaments"),
        champions: await collect("champions"),
        resultsTable: await collect("resultsTable")
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });

  function replaceNameInString(str, oldN, newN) {
    if (!str || typeof str !== "string") return str;
    if (str === oldN) return newN;
    const parts = str.split(" & ");
    if (parts.length > 1) {
      return parts.map(p => p.trim() === oldN ? newN : p.trim()).join(" & ");
    }
    return str;
  }

  /* Fully automated background sync engine */
  async function autoSyncDatabaseSilently() {
    if (!poolPlayers || poolPlayers.length === 0) return;
    const idToCurrentName = {};
    poolPlayers.forEach(p => { if (p.id && p.name) idToCurrentName[p.id] = p.name; });

    try {
      const tourSnaps = await getDocs(collection(db, "tournaments"));
      const globalRenames = {};

      for (const tDoc of tourSnaps.docs) {
        const t = tDoc.data();
        const localRenameMap = {};

        // 1. Detect renames in single participants
        if (Array.isArray(t.participants)) {
          t.participants.forEach(p => {
            if (p.id && idToCurrentName[p.id] && p.name !== idToCurrentName[p.id]) {
              localRenameMap[p.name] = idToCurrentName[p.id];
              globalRenames[p.name] = idToCurrentName[p.id];
              p.name = idToCurrentName[p.id];
            }
          });
        }

        // 2. Detect renames in tag-team rosters & recompute duo names
        if (Array.isArray(t.teams)) {
          t.teams.forEach(team => {
            const prevTeamName = team.teamName;
            let rosterChanged = false;
            (team.members || []).forEach(m => {
              if (m.id && idToCurrentName[m.id] && m.name !== idToCurrentName[m.id]) {
                localRenameMap[m.name] = idToCurrentName[m.id];
                globalRenames[m.name] = idToCurrentName[m.id];
                m.name = idToCurrentName[m.id];
                rosterChanged = true;
              }
            });
            if (rosterChanged) {
              const freshTeamName = team.members.map(m => m.name).join(" & ");
              if (prevTeamName && prevTeamName !== freshTeamName) {
                localRenameMap[prevTeamName] = freshTeamName;
                globalRenames[prevTeamName] = freshTeamName;
                team.teamName = freshTeamName;
              }
            }
          });
        }

        // 3. If renames were found, cascade through the entire tournament document
        if (Object.keys(localRenameMap).length > 0) {
          const applyMap = (str) => {
            if (!str || typeof str !== "string") return str;
            if (localRenameMap[str]) return localRenameMap[str];
            let res = str;
            for (const [oldN, newN] of Object.entries(localRenameMap)) {
              res = replaceNameInString(res, oldN, newN);
            }
            return res;
          };

          if (t.winner) t.winner = applyMap(t.winner);
          if (t.runnerUp) t.runnerUp = applyMap(t.runnerUp);

          if (Array.isArray(t.groups)) {
            t.groups.forEach(g => {
              if (Array.isArray(g.members)) g.members = g.members.map(applyMap);
            });
          }

          if (Array.isArray(t.matches)) {
            t.matches.forEach(m => {
              m.sideA = applyMap(m.sideA);
              m.sideB = applyMap(m.sideB);
            });
          }

          if (t.knockout && Array.isArray(t.knockout.stages)) {
            t.knockout.stages.forEach(st => {
              if (Array.isArray(st.matches)) {
                st.matches.forEach(km => {
                  km.sideA = applyMap(km.sideA);
                  km.sideB = applyMap(km.sideB);
                });
              }
            });
          }

          const updatePayload = {
            matches: t.matches || null,
            groups: t.groups || null,
            winner: t.winner || null,
            runnerUp: t.runnerUp || null
          };
          if (t.participants) updatePayload.participants = t.participants;
          if (t.teams) updatePayload.teams = t.teams;
          if (t.knockout) updatePayload.knockout = t.knockout;

          await updateDoc(doc(db, "tournaments", tDoc.id), updatePayload);

          try {
            await updateDoc(doc(db, "resultsTable", tDoc.id), {
              winner: t.winner,
              runnerUp: t.runnerUp
            });
          } catch (rErr) {}
        }
      }

      // 4. Sync champions collection with any updated names
      if (Object.keys(globalRenames).length > 0) {
        try {
          const champSnaps = await getDocs(collection(db, "champions"));
          for (const cDoc of champSnaps.docs) {
            const cd = cDoc.data();
            let w = cd.winner, ru = cd.runnerUp;
            for (const [oldN, newN] of Object.entries(globalRenames)) {
              w = replaceNameInString(w, oldN, newN);
              ru = replaceNameInString(ru, oldN, newN);
            }
            if (w !== cd.winner || ru !== cd.runnerUp) {
              await updateDoc(doc(db, "champions", cDoc.id), { winner: w, runnerUp: ru });
            }
          }
        } catch (cErr) {}
        tournamentRecordsCache = null;
      }
    } catch (err) {
      console.warn("Background auto-sync skipped:", err);
    }
  }

  async function computePlayerRating(participant) {
    if (participant.type !== "pool") return 50;
    const p = poolPlayers.find(x => x.id === participant.id);
    if (!p) return 50;
    const matches = num2(p.singleMatchesPlayed);
    const winRate = matches > 0 ? num2(p.singleWins) / matches : 0.5;
    const goalDiffPerMatch = matches > 0 ? (num2(p.singleGoalsFor) - num2(p.singleGoalsAgainst)) / matches : 0;
    const tagMatches = num2(p.tagTeamFinalWins) + num2(p.tagTeamFinalLosses);
    const tagWinRate = tagMatches > 0 ? num2(p.tagTeamFinalWins) / tagMatches : 0.5;
    const form = await getRecentFormResults(p.id);
    const formScore = form.reduce((sum, r) => sum + (r === "W" ? 2 : r === "L" ? -1 : 0), 0);
    return winRate * 60 + goalDiffPerMatch * 5 + tagWinRate * 25 + formScore * 3;
  }

  async function autoBalanceTeams(participants) {
    const rated = [];
    for (const p of participants) {
      const rating = await computePlayerRating(p);
      rated.push({ ...p, rating });
    }
    rated.sort((a, b) => b.rating - a.rating);
    const pairs = [];
    let i = 0, j = rated.length - 1;
    while (i < j) { pairs.push([rated[i], rated[j]]); i++; j--; }
    return pairs.map(pair => ({ members: pair.map(m => ({ type: m.type, id: m.id, name: m.name })), teamName: pair.map(m => m.name).join(" & ") }));
  }

  function fairShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setupGroups(random) {
    const gc = parseInt(document.getElementById("groupCountInput").value, 10);
    const names = currentSideNames();
    if (!gc || gc < 2) { showToast("Enter a valid number of groups.", "error"); return; }
    if (names.length % gc !== 0) { showToast("Participant count (" + names.length + ") must divide evenly into " + gc + " groups.", "error"); return; }
    groupCount = gc;
    const perGroup = names.length / gc;
    if (random) {
      const shuffled = fairShuffle(names);
      groups = Array.from({ length: gc }, (_, i) => shuffled.slice(i * perGroup, (i + 1) * perGroup));
      renderGroupsPreview(true, perGroup);
    } else {
      groups = Array.from({ length: gc }, () => []);
      renderGroupsPreview(false, perGroup);
    }
  }

  function roundRobinMatches(names) {
    const matches = [];
    for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) matches.push({ sideA: names[i], sideB: names[j], scoreA: null, scoreB: null });

  async function saveTournament() {
    const statusEl = document.getElementById("createStatus");
    if (!sel.format) { statusEl.textContent = "Select a format."; return; }
    if (sel.format === "tagteam" && !sel.subMode) { statusEl.textContent = "Select a controller mode."; return; }
    if (sel.format === "tagteam" && sel.subMode === "regular" && !sel.teamSize) { statusEl.textContent = "Select a team size."; return; }
    if (!sel.time) { statusEl.textContent = "Set a match time."; return; }

    const pointsMode = document.querySelector("#pointsSystemOptions .selected");
    let pointsSystem = { win: 3, draw: 1, loss: 0 };
    if (pointsMode && pointsMode.dataset.v === "custom") {
      pointsSystem = {
        win: parseInt(document.getElementById("pointsWinInput").value, 10) || 0,
        draw: parseInt(document.getElementById("pointsDrawInput").value, 10) || 0,
        loss: parseInt(document.getElementById("pointsLossInput").value, 10) || 0
      };
    }
    const dateToday = todayNameFragment();
    const base = {
      format: sel.format,
      subMode: sel.subMode,
      teamSize: sel.teamSize,
      matchTimeMinutes: sel.time,
      usePenalties: sel.usePenalties,
      pointsSystem,
      dateStr: dateToday,
      name: dateToday + " " + typeLabel(),
      createdAt: Date.now()
    };

    try {
      if (sel.format === "single") {
        if (singleParticipants.length < 2) { statusEl.textContent = "Add at least 2 participants."; return; }
        await finalizeAndSave(base, { participants: singleParticipants }, singleParticipants.map(p => p.name));
      } else if (sel.subMode === "regular") {
        if (regularTeams[0].length !== sel.teamSize || regularTeams[1].length !== sel.teamSize) {
          statusEl.textContent = "Both teams need exactly " + sel.teamSize + " member(s). Complete team assignment.";
          return;
        }
        const teamData = regularTeams.map(t => ({ members: t, teamName: t.map(m => m.name).join(" & ") }));
        await addDoc(collection(db, "tournaments"), { ...base, teams: teamData, status: "ready" });
        statusEl.textContent = "Tournament created. Go to Live tournaments to play the match.";
      } else {
        if (!multiTeamCount || multiTeams.some(t => t.length !== 2)) { statusEl.textContent = "Set team count and fill every team with 2 members."; return; }
        const teamData = multiTeams.map(t => ({ members: t, teamName: t.map(m => m.name).join(" & ") }));
        await finalizeAndSave(base, { teamCount: multiTeamCount, teams: teamData }, teamData.map(t => t.teamName));
      }
    } catch (e) {
      statusEl.textContent = "Failed: " + e.message;
    }
  }

  async function finalizeAndSave(base, extra, names) {
    const statusEl = document.getElementById("createStatus");
    if (names.length === 2) {
      await addDoc(collection(db, "tournaments"), { ...base, ...extra, status: "ready" });
      statusEl.textContent = "Tournament created. Go to Live tournaments to play the match.";
      return;
    }
    if (!bracketStyle) { statusEl.textContent = "Choose a bracket style for " + names.length + " participants."; return; }
    let matches = [], groupsData = null;
    if (bracketStyle === "roundrobin") {

  function sideRef(data, name) {
    if (data.participants) { const p = data.participants.find(x => x.name === name); return p ? [{ id: p.id, type: p.type }] : []; }
    if (data.teams) { const t = data.teams.find(x => x.teamName === name); return t ? t.members.map(m => ({ id: m.id, type: m.type })) : []; }
    return [];
  }

    document.getElementById("saveBtn_" + tid).addEventListener("click", async (ev) => {
      const s1 = parseInt(document.getElementById("s1_" + tid).value, 10);

      const pensRow = document.getElementById("pens_" + tid);
      if (isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0) { statusEl.textContent = "Enter valid scores."; return; }

      let penaltyWinnerIsA = null;
      const penaltiesEnabled = data.usePenalties !== false;
      if (s1 === s2) {
        if (!penaltiesEnabled) { statusEl.textContent = "This tournament requires a decisive score — no draws allowed."; return; }
        if (pensRow.style.display === "none") {
          pensRow.style.display = "flex";
          document.getElementById("saveBtn_" + tid).textContent = "Save penalty result";
          statusEl.textContent = "Scores are level — enter the penalty shootout result.";
          return;
        }
        const p1 = parseInt(document.getElementById("p1_" + tid).value, 10);
        const p2 = parseInt(document.getElementById("p2_" + tid).value, 10);
        if (isNaN(p1) || isNaN(p2) || p1 < 0 || p2 < 0 || p1 === p2) { statusEl.textContent = "Enter valid, non-tied penalty scores."; return; }
        penaltyWinnerIsA = p1 > p2;
        var penaltyScores = { p1, p2 };
      }

      if (ev.target.disabled) return;
      ev.target.disabled = true;
      try {
        await finalizeTournament(tid, data, nameA, nameB, s1, s2, penaltyScores);
        statusEl.textContent = "Result saved.";
        const winnerName = s1 !== s2 ? (s1 > s2 ? nameA : nameB) : (penaltyWinnerIsA ? nameA : nameB);
        showWinnerBanner(container, winnerName);
        setTimeout(() => renderLiveTournaments(), 2200);
      } catch (e) { statusEl.textContent = "Failed: " + e.message; ev.target.disabled = false; }
    });
  }

  function tagPrefix(subMode) { return subMode === "regular" ? "tagRegular" : "tagMulti"; }

  async function finalizeTournament(tid, data, nameA, nameB, s1, s2, penaltyScores) {
    const wentToPenalties = s1 === s2 && penaltyScores;
    const winnerName = wentToPenalties ? (penaltyScores.p1 > penaltyScores.p2 ? nameA : nameB) : (s1 > s2 ? nameA : nameB);
    const runnerUpName = winnerName === nameA ? nameB : nameA;

    // Renames tournament to date only upon finish
    const finishedName = data.dateStr || (data.name ? data.name.replace(/\s+(Single Player|Tag Team|Regular|Multiple|Controller|Tournament).*$/i, "").trim() : todayNameFragment());

    if (data.format === "single") {
      const refA = sideRef(data, nameA)[0], refB = sideRef(data, nameB)[0];
      const aWon = winnerName === nameA, bWon = winnerName === nameB;
      if (refA && refA.type === "pool" && refA.id) await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: s1, singleGoalsAgainst: s2, singleWins: aWon ? 1 : 0, singleLosses: bWon ? 1 : 0 });
      if (refB && refB.type === "pool" && refB.id) await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: s2, singleGoalsAgainst: s1, singleWins: bWon ? 1 : 0, singleLosses: aWon ? 1 : 0 });
    } else {
      if (data.subMode === "multi") {
        const winnerMembersForMatch = sideRef(data, winnerName), loserMembersForMatch = sideRef(data, runnerUpName);
        for (const m of winnerMembersForMatch) { if (m.type === "pool" && m.id) await bump(m.id, { tagMultiMatchesPlayed: 1, tagMultiWins: 1 }); }
        for (const m of loserMembersForMatch) { if (m.type === "pool" && m.id) await bump(m.id, { tagMultiMatchesPlayed: 1, tagMultiLosses: 1 }); }
      }
    }

    const allMembers = data.format === "single" ? data.participants : data.teams.flatMap(t => t.members);
    const prefix = tagPrefix(data.subMode);
    for (const m of allMembers) {
      if (m.type !== "pool" || !m.id) continue;
      if (data.format === "single") await bump(m.id, { singleTournamentsPlayed: 1 });
      else await bump(m.id, { [prefix + "TournamentsPlayed"]: 1 });
    }
    const winnerMembers = sideRef(data, winnerName), loserMembers = sideRef(data, runnerUpName);
    for (const m of winnerMembers) { if (m.type !== "pool" || !m.id) continue; if (data.format === "single") await bump(m.id, { singleChampionships: 1 }); else await bump(m.id, { [prefix + "Championships"]: 1 }); }
    for (const m of loserMembers) { if (m.type !== "pool" || !m.id) continue; if (data.format === "single") await bump(m.id, { singleRunnerUps: 1 }); else await bump(m.id, { [prefix + "RunnerUps"]: 1 }); }

    const finalScore = { side1: s1, side2: s2 };
    if (wentToPenalties) { finalScore.penalty1 = penaltyScores.p1; finalScore.penalty2 = penaltyScores.p2; }

    await updateDoc(doc(db, "tournaments", tid), {
      name: finishedName,
      status: "completed",
      finalScore,
      winner: winnerName,
      runnerUp: runnerUpName
    });
    await setDoc(doc(db, "champions", data.format + "_" + (data.subMode || "none")), {
      tournamentName: finishedName,
      winner: winnerName,
      runnerUp: runnerUpName,
      updatedAt: Date.now()
    });
    await setDoc(doc(db, "resultsTable", tid), {
      format: data.format,
      subMode: data.subMode || null,
      tournamentName: finishedName,
      winner: winnerName,
      runnerUp: runnerUpName,
      completedAt: Date.now()
    });
    try { await loadPool(); } catch (e) {}
    tournamentRecordsCache = null;
  }
// comment ==> 27. Single Match Engine & Result Finalization ends here

 // comment ==> 28. Standings & Group Matches Engine starts from here
  function getQualCount(data) {
    if (!data || !data.knockout) return 0;
    const isGrouped = !!data.groups;
    const opt = data.knockout.option;
    if (opt === "final_only") return isGrouped ? 1 : 2;
    if (opt === 1) return isGrouped ? 2 : 4;
    if (opt === 2) return isGrouped ? 3 : 6;
    if (opt === 3) return isGrouped ? 4 : 8;
    if (opt === "eliminator") return 3;
    return 0;
  }

  function computeStandings(sideNames, matches, pointsSystem) {
    const pts = pointsSystem || { win: 3, draw: 1, loss: 0 };
    const stats = {};
    sideNames.forEach(n => { stats[n] = { name: n, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0 }; });
    matches.forEach(m => {
      if (m.scoreA === null || m.scoreB === null || !stats[m.sideA] || !stats[m.sideB]) return;
      stats[m.sideA].played++; stats[m.sideB].played++;
      stats[m.sideA].gf += m.scoreA; stats[m.sideA].ga += m.scoreB;
      stats[m.sideB].gf += m.scoreB; stats[m.sideB].ga += m.scoreA;
      if (m.scoreA > m.scoreB) { stats[m.sideA].wins++; stats[m.sideB].losses++; }
      else if (m.scoreB > m.scoreA) { stats[m.sideB].wins++; stats[m.sideA].losses++; }
      else { stats[m.sideA].draws++; stats[m.sideB].draws++; }
    });
    Object.values(stats).forEach(s => { s.points = s.wins * pts.win + s.draws * pts.draw + s.losses * pts.loss; });
    return Object.values(stats).sort((a, b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  }

  function getPlayerRecentForm(name, matches) {
    const done = matches.filter(m => (m.sideA === name || m.sideB === name) && m.scoreA !== null && m.scoreB !== null);
    const last3 = done.slice(-3);
    return last3.map(m => {
      const isA = m.sideA === name;
      const myScore = isA ? m.scoreA : m.scoreB;
      const oppScore = isA ? m.scoreB : m.scoreA;
      if (myScore > oppScore) return "W";
      if (myScore < oppScore) return "L";
      return "D";
    });
  }

  async function saveGroupMatch(tid, data, idx, container, btn) {
    const inputA = container.querySelector('input[data-idx="' + idx + '"][data-side="A"]');
    const inputB = container.querySelector('input[data-idx="' + idx + '"][data-side="B"]');
    const sA = parseInt(inputA.value, 10), sB = parseInt(inputB.value, 10);
    if (isNaN(sA) || isNaN(sB) || sA < 0 || sB < 0) { showToast("Enter valid scores.", "error"); if (btn) btn.disabled = false; return; }
    const wasAlreadyScored = data.matches[idx].scoreA !== null;
    const prevA = data.matches[idx].scoreA, prevB = data.matches[idx].scoreB;
    data.matches[idx].scoreA = sA; data.matches[idx].scoreB = sB;

    try {
      await updateDoc(doc(db, "tournaments", tid), { matches: data.matches });
    } catch (saveErr) {
      data.matches[idx].scoreA = prevA; data.matches[idx].scoreB = prevB;
      if (btn) btn.disabled = false;
      showToast("Couldn't save: " + (saveErr.message || "connection issue"), "error");
      return;
    }

    if (!wasAlreadyScored) {
      try {
        if (data.format === "single") {
          const refA = sideRef(data, data.matches[idx].sideA)[0], refB = sideRef(data, data.matches[idx].sideB)[0];
          if (refA && refA.type === "pool" && refA.id) await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: sA, singleGoalsAgainst: sB, singleWins: sA > sB ? 1 : 0, singleDraws: sA === sB ? 1 : 0, singleLosses: sA < sB ? 1 : 0 });
          if (refB && refB.type === "pool" && refB.id) await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: sB, singleGoalsAgainst: sA, singleWins: sB > sA ? 1 : 0, singleDraws: sA === sB ? 1 : 0, singleLosses: sB < sA ? 1 : 0 });
        } else if (data.format === "tagteam") {
          const sideAMembers = sideRef(data, data.matches[idx].sideA), sideBMembers = sideRef(data, data.matches[idx].sideB);
          for (const m of sideAMembers) { if (m.type === "pool" && m.id) await bump(m.id, { tagMultiMatchesPlayed: 1, tagMultiWins: sA > sB ? 1 : 0, tagMultiLosses: sA < sB ? 1 : 0 }); }
          for (const m of sideBMembers) { if (m.type === "pool" && m.id) await bump(m.id, { tagMultiMatchesPlayed: 1, tagMultiWins: sB > sA ? 1 : 0, tagMultiLosses: sB < sA ? 1 : 0 }); }
        }
        await loadPool();
      } catch (statsErr) {
        console.warn("Stats background update skipped:", statsErr);
      }
    }

    showToast("Match saved!");
    try {
      await refreshTournamentCard(tid, container);
    } catch (refErr) {
      console.warn("Card auto-refresh error:", refErr);
    }
  }

  }

  async function generateEliminatorKnockout(tid, data) {
    const { direct } = seedQualifiers(data, 1);
    if (direct.length !== 4) {
      showToast("The Elemmenator System needs exactly 4 qualifying participants/teams.", "error");
      return;
    }
    const stages = [
      { name: "Match 1", matches: [{ id: "m1", sideA: direct[0], sideB: direct[1], scoreA: null, scoreB: null }] },
      { name: "Match 2", matches: [{ id: "m2", sideA: "TBD", sideB: direct[2], scoreA: null, scoreB: null }] },
      { name: "Final", matches: [{ id: "f0", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null }] }
    ];
    await updateDoc(doc(db, "tournaments", tid), { knockout: { option: "eliminator", stages } });

// comment ==> 30. Knockout Bracket Generation Logic starts from here
  function seedQualifiers(data, option) {
    const grouped = !!data.groups;
    let direct = [], nextTier = [];
    if (grouped) {
      data.groups.forEach((g, gi) => {
        const standings = computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi), data.pointsSystem);
        if (option === 1) direct.push(...standings.slice(0, 2));
        else { direct.push(standings[0]); nextTier.push(...standings.slice(1, 3)); }
      });
    } else {
      const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
      const standings = computeStandings(allNames, data.matches, data.pointsSystem);
      if (option === 1) direct = standings.slice(0, 4);
      else { direct = standings.slice(0, 2); nextTier = standings.slice(2, 6); }
    }
    return { direct: direct.map(r => r.name), nextTier: nextTier.map(r => r.name) };
  }

  function totalSideCount(data) {
    if (data.groups) return data.groups.reduce((sum, g) => sum + g.members.length, 0);
    return new Set(data.matches.flatMap(m => [m.sideA, m.sideB])).size;
  }

  function seedQuarterfinalists(data) {
    const grouped = !!data.groups;
    let qualifiers = [];
    if (grouped) {
      data.groups.forEach((g, gi) => {
        const standings = computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi), data.pointsSystem);
        qualifiers.push(...standings.slice(0, 2));
      });
    } else {
      const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
      qualifiers = computeStandings(allNames, data.matches, data.pointsSystem).slice(0, 8);
    }
    return qualifiers.map(r => r.name);
  }

  async function generateKnockout(tid, data, option) {
    const stages = [];

    // --- Option: Top 2 straight to Final ---
    if (option === "final_only") {
      let top2 = [];
      if (data.groups) {
        data.groups.forEach((g, gi) => {
          const standings = computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi), data.pointsSystem);
          if (standings.length > 0) top2.push(standings[0].name);
        });
        if (top2.length !== 2) {
          const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
          top2 = computeStandings(allNames, data.matches, data.pointsSystem).slice(0, 2).map(r => r.name);
        }
      } else {
        const allNames = [...new Set(data.matches.flatMap(m => [m.sideA, m.sideB]))];
        top2 = computeStandings(allNames, data.matches, data.pointsSystem).slice(0, 2).map(r => r.name);
      }

      if (top2.length < 2) {
        showToast("Need at least 2 participants/teams in the standings to form a final.", "error");
        return;
      }

      stages.push({
        name: "Final",
        matches: [{ id: "f0", sideA: top2[0], sideB: top2[1], scoreA: null, scoreB: null }]
      });

      await updateDoc(doc(db, "tournaments", tid), { knockout: { option: "final_only", stages } });
      return;
    }

    if (option === 3) {
      let qfMatches = [];

      if (data.groups && data.groups.length === 2 && data.groups[0].members.length >= 4 && data.groups[1].members.length >= 4) {
        const A = computeStandings(data.groups[0].members, data.matches.filter(m => m.groupIndex === 0), data.pointsSystem).map(r => r.name).slice(0, 4);
        const B = computeStandings(data.groups[1].members, data.matches.filter(m => m.groupIndex === 1), data.pointsSystem).map(r => r.name).slice(0, 4);
        qfMatches = [
          { id: "q0", sideA: A[0], sideB: B[3], scoreA: null, scoreB: null },
          { id: "q1", sideA: A[1], sideB: B[2], scoreA: null, scoreB: null },
          { id: "q2", sideA: A[2], sideB: B[1], scoreA: null, scoreB: null },
          { id: "q3", sideA: A[3], sideB: B[0], scoreA: null, scoreB: null }
        ];
      } else if (data.groups && data.groups.length === 3 && data.groups.every(g => g.members.length >= 4)) {
        const groupStandings = data.groups.map((g, gi) => computeStandings(g.members, data.matches.filter(m => m.groupIndex === gi), data.pointsSystem));
        const withGroup = (r, gi) => ({ name: r.name, group: gi, wins: r.wins, gd: r.gf - r.ga, gf: r.gf });
        const rankTier = (arr) => arr.slice().sort((a, b) => b.wins - a.wins || b.gd - a.gd || b.gf - a.gf);

        const winners = rankTier(groupStandings.map((s, gi) => withGroup(s[0], gi)));
        const runnersUp = rankTier(groupStandings.map((s, gi) => withGroup(s[1], gi)));
        const thirds = rankTier(groupStandings.map((s, gi) => withGroup(s[2], gi))).slice(0, 2);

        let seeds = [...winners, ...runnersUp, ...thirds];
        const pairIdx = [[0, 7], [1, 6], [2, 5], [3, 4]];
        const hasClash = (arr) => pairIdx.some(([i, j]) => arr[i].group === arr[j].group);
        if (hasClash(seeds)) {
          const swapped = seeds.slice();
          [swapped[6], swapped[7]] = [swapped[7], swapped[6]];
          if (!hasClash(swapped)) seeds = swapped;
        }
        qfMatches = pairIdx.map(([i, j], idx) => ({ id: "q" + idx, sideA: seeds[i].name, sideB: seeds[j].name, scoreA: null, scoreB: null }));
      } else {
        const q = seedQuarterfinalists(data);
        if (q.length !== 8) {
          showToast("Quarterfinals need exactly 8 qualifying participants/teams (2 groups of 4, 4 groups of top-2, or 8 in round-robin) — current setup gives " + q.length + ".", "error");
          return;
        }
        qfMatches = [
          { id: "q0", sideA: q[0], sideB: q[7], scoreA: null, scoreB: null },
          { id: "q1", sideA: q[3], sideB: q[4], scoreA: null, scoreB: null },
          { id: "q2", sideA: q[1], sideB: q[6], scoreA: null, scoreB: null },
          { id: "q3", sideA: q[2], sideB: q[5], scoreA: null, scoreB: null }
        ];
      }

      stages.push({ name: "Quarterfinal", matches: qfMatches });
      stages.push({ name: "Semifinal", matches: [
        { id: "s0", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null },
        { id: "s1", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null }
      ]});
      stages.push({ name: "Final", matches: [ { id: "f0", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null } ] });
      await updateDoc(doc(db, "tournaments", tid), { knockout: { option, stages } });
      return;
    }

    const { direct, nextTier } = seedQualifiers(data, option);
    if (option === 2 && nextTier.length === 4) {
      stages.push({ name: "Pre-semifinal", matches: [
        { id: "p0", sideA: nextTier[0], sideB: nextTier[3], scoreA: null, scoreB: null },
        { id: "p1", sideA: nextTier[1], sideB: nextTier[2], scoreA: null, scoreB: null }
      ]});
      stages.push({ name: "Semifinal", matches: [
        { id: "s0", sideA: direct[0] || "TBD", sideB: "TBD (pre-semi winner)", scoreA: null, scoreB: null },
        { id: "s1", sideA: direct[1] || "TBD", sideB: "TBD (pre-semi winner)", scoreA: null, scoreB: null }
      ]});
    } else if (direct.length === 4) {
      stages.push({ name: "Semifinal", matches: [
        { id: "s0", sideA: direct[0], sideB: direct[3], scoreA: null, scoreB: null },
        { id: "s1", sideA: direct[1], sideB: direct[2], scoreA: null, scoreB: null }
      ]});
    } else {
      showToast("Could not determine a clean 4-team knockout stage from the current standings — you may need to adjust group/team counts.", "error");
      return;
    }
    stages.push({ name: "Final", matches: [ { id: "f0", sideA: "TBD", sideB: "TBD", scoreA: null, scoreB: null } ] });
    await updateDoc(doc(db, "tournaments", tid), { knockout: { option, stages } });
  }

  let justResolvedKnockoutKey = null;

  function buildBreadcrumb(stages) {
    const currentIdx = stages.findIndex(s => s.matches.some(m => m.scoreA === null));
    const strip = document.createElement("div");
    strip.className = "stage-breadcrumb";
    stages.forEach((s, i) => {
      const step = document.createElement("span");
      let cls = "step";
      if (i === currentIdx) cls += " current";
      else if (currentIdx === -1 || i < currentIdx) cls += " done";
      step.className = cls;
      step.textContent = s.name;
      strip.appendChild(step);
    });
    return strip;
  }

  function panBracketOnce(columnsEl) {
    if (!columnsEl || columnsEl.dataset.panned || columnsEl.scrollWidth <= columnsEl.clientWidth) return;
    columnsEl.dataset.panned = "1";
    setTimeout(() => {
      columnsEl.scrollTo({ left: columnsEl.scrollWidth, behavior: "smooth" });
      setTimeout(() => columnsEl.scrollTo({ left: 0, behavior: "smooth" }), 900);
    }, 300);
  }

  function highlightPlayerRoute(wrap, playerName) {
    const boxes = wrap.querySelectorAll(".bracket-match");
    const alreadyOn = wrap.dataset.highlighted === playerName;
    boxes.forEach(b => b.classList.remove("path-highlight"));
    wrap.dataset.highlighted = alreadyOn ? "" : playerName;
    if (alreadyOn) return;
    boxes.forEach(b => {
      if (b.dataset.sideA === playerName || b.dataset.sideB === playerName) b.classList.add("path-highlight");

  function attachNameClickHandlers(wrap) {
    wrap.querySelectorAll(".side-name.clickable").forEach(el => {
      el.addEventListener("click", (e) => {

  function renderKnockout(container, tid, data) {
    const wrap = document.createElement("div");
    wrap.innerHTML = "<h3>Knockout stage</h3>";
    wrap.appendChild(buildBreadcrumb(data.knockout.stages));
    const columns = document.createElement("div");
    columns.className = "bracket-columns";
    const penaltiesEnabled = data.usePenalties !== false;

    let awaitingKey = null;
    for (let si = 0; si < data.knockout.stages.length && !awaitingKey; si++) {
      const stage = data.knockout.stages[si];
      for (let mi = 0; mi < stage.matches.length; mi++) {
        const m = stage.matches[mi];
        const bothKnown = !m.sideA.toString().startsWith("TBD") && !m.sideB.toString().startsWith("TBD");
        if (bothKnown && m.scoreA === null) { awaitingKey = si + "_" + mi; break; }
      }
    }

    data.knockout.stages.forEach((stage, si) => {
      const isFinalStage = si === data.knockout.stages.length - 1;
      const col = document.createElement("div");
      col.className = "bracket-col" + (isFinalStage ? " bracket-final" : "");
      const prevStageDone = si === 0 || data.knockout.stages[si - 1].matches.every(m => m.scoreA !== null);
      if (si > 0 && prevStageDone) col.classList.add("connector-lit");
      col.innerHTML = "<h4>" + stage.name + "</h4>";

      stage.matches.forEach((m, mi) => {
        const box = document.createElement("div");
        const key = si + "_" + mi;
        const bothKnown = !m.sideA.toString().startsWith("TBD") && !m.sideB.toString().startsWith("TBD");
        const decided = m.scoreA !== null && m.scoreB !== null;
        const wentToPens = decided && m.scoreA === m.scoreB;

  async function saveKnockoutMatch(tid, data, si, mi, container, btn, pensId, penaltiesEnabled) {
    const inputA = container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-side="A"]');
    const inputB = container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-side="B"]');
    const sA = parseInt(inputA.value, 10), sB = parseInt(inputB.value, 10);
    const statusMsg = (t) => showToast(t, "error");
    if (isNaN(sA) || isNaN(sB) || sA < 0 || sB < 0) { statusMsg("Enter valid scores."); return; }

    let penA = null, penB = null;
    if (sA === sB) {
      if (!penaltiesEnabled) { statusMsg("This tournament requires a decisive score — no draws allowed."); return; }
      const pensDiv = document.getElementById(pensId);
      if (pensDiv.style.display === "none") {
        pensDiv.style.display = "block";
        btn.textContent = "Save penalty result";
        return;
      }
      penA = parseInt(container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-pen="A"]').value, 10);
      penB = parseInt(container.querySelector('input[data-stage="' + si + '"][data-match="' + mi + '"][data-pen="B"]').value, 10);
      if (isNaN(penA) || isNaN(penB) || penA < 0 || penB < 0 || penA === penB) { statusMsg("Enter valid, non-tied penalty scores."); return; }
    }
    btn.disabled = true;

    const stage = data.knockout.stages[si];
    const m = stage.matches[mi];
    const wasAlreadyScored = m.scoreA !== null;
    const prevState = { scoreA: m.scoreA, scoreB: m.scoreB, penaltyA: m.penaltyA, penaltyB: m.penaltyB };
    m.scoreA = sA; m.scoreB = sB;
    if (penA !== null) { m.penaltyA = penA; m.penaltyB = penB; }
    const winner = (sA === sB) ? (penA > penB ? m.sideA : m.sideB) : (sA > sB ? m.sideA : m.sideB);

    try {
      if (wasAlreadyScored) {
        await updateDoc(doc(db, "tournaments", tid), { knockout: data.knockout });
        showToast("Score updated!");
        await refreshTournamentCard(tid, container);
        return;
      }

      if (!wasAlreadyScored) {
        try {
          if (data.format === "single") {
            const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
            const aWon = winner === m.sideA, bWon = winner === m.sideB;
            if (refA && refA.type === "pool" && refA.id) await bump(refA.id, { singleMatchesPlayed: 1, singleGoalsFor: sA, singleGoalsAgainst: sB, singleWins: aWon ? 1 : 0, singleLosses: bWon ? 1 : 0 });
            if (refB && refB.type === "pool" && refB.id) await bump(refB.id, { singleMatchesPlayed: 1, singleGoalsFor: sB, singleGoalsAgainst: sA, singleWins: bWon ? 1 : 0, singleLosses: aWon ? 1 : 0 });
          } else if (data.format === "tagteam") {
            const aWon = winner === m.sideA, bWon = winner === m.sideB;
            for (const mem of sideRef(data, m.sideA)) { if (mem.type === "pool" && mem.id) await bump(mem.id, { tagMultiMatchesPlayed: 1, tagMultiWins: aWon ? 1 : 0, tagMultiLosses: bWon ? 1 : 0 }); }
            for (const mem of sideRef(data, m.sideB)) { if (mem.type === "pool" && mem.id) await bump(mem.id, { tagMultiMatchesPlayed: 1, tagMultiWins: bWon ? 1 : 0, tagMultiLosses: aWon ? 1 : 0 }); }
          }
          await loadPool();
        } catch (statsErr) {
          console.warn("Knockout stats update skipped:", statsErr);
        }
      }
      justResolvedKnockoutKey = si + "_" + mi;

      const isQuarterfinalStage = si === 0 && data.knockout.stages[0].name === "Quarterfinal";
      if (data.knockout.option === "eliminator" && si === 0) {
        const loserName = winner === m.sideA ? m.sideB : m.sideA;
        const finalMatch = data.knockout.stages[2].matches[0];
        if (finalMatch.sideA.toString().startsWith("TBD")) finalMatch.sideA = winner; else finalMatch.sideB = winner;
        const match2 = data.knockout.stages[1].matches[0];
        if (match2.sideA.toString().startsWith("TBD")) match2.sideA = loserName; else match2.sideB = loserName;
      } else if (isQuarterfinalStage) {
      } else if (si + 1 < data.knockout.stages.length) {
        const nextStage = data.knockout.stages[si + 1];
        const slot = nextStage.matches.find(nm => nm.sideA.toString().startsWith("TBD") || nm.sideB.toString().startsWith("TBD"));
        if (slot) { if (slot.sideA.toString().startsWith("TBD")) slot.sideA = winner; else slot.sideB = winner; }
      }

      const isFinal = si === data.knockout.stages.length - 1;
      await updateDoc(doc(db, "tournaments", tid), { knockout: data.knockout });

      if (isFinal) {
        const winnerName = winner, runnerUpName = winner === m.sideA ? m.sideB : m.sideA;
        const allMembers = data.format === "single" ? data.participants : data.teams.flatMap(t => t.members);
        const prefix = tagPrefix(data.subMode);

        // Renames tournament to date only upon finish
        const finishedName = data.dateStr || (data.name ? data.name.replace(/\s+(Single Player|Tag Team|Regular|Multiple|Controller|Tournament).*$/i, "").trim() : todayNameFragment());

        try {
          for (const mem of allMembers) {
            if (mem.type !== "pool" || !mem.id) continue;
            if (data.format === "single") await bump(mem.id, { singleTournamentsPlayed: 1 });
            else await bump(mem.id, { [prefix + "TournamentsPlayed"]: 1 });
          }
          const winMembers = sideRef(data, winnerName), loseMembers = sideRef(data, runnerUpName);
          for (const mem of winMembers) { if (mem.type !== "pool" || !mem.id) continue; if (data.format === "single") await bump(mem.id, { singleChampionships: 1 }); else await bump(mem.id, { [prefix + "Championships"]: 1 }); }
          for (const mem of loseMembers) { if (mem.type !== "pool" || !mem.id) continue; if (data.format === "single") await bump(mem.id, { singleRunnerUps: 1 }); else await bump(mem.id, { [prefix + "RunnerUps"]: 1 }); }
        } catch (fStatsErr) {
          console.warn("Final stats bump skipped:", fStatsErr);
        }

        await updateDoc(doc(db, "tournaments", tid), {
          name: finishedName,
          status: "completed",
          winner: winnerName,
          runnerUp: runnerUpName
        });
        await setDoc(doc(db, "champions", data.format + "_" + (data.subMode || "none")), {
          tournamentName: finishedName,
          winner: winnerName,
          runnerUp: runnerUpName,
          updatedAt: Date.now()
        });
        await setDoc(doc(db, "resultsTable", tid), {
          format: data.format,
          subMode: data.subMode || null,
          tournamentName: finishedName,
          winner: winnerName,
          runnerUp: runnerUpName,
          completedAt: Date.now()
        });
        try { await loadPool(); } catch (e) {}
        tournamentRecordsCache = null;
        showWinnerBanner(container, winnerName);
        setTimeout(() => refreshTournamentCard(tid, container), 2200);
        return;
      }

      showToast("Score saved!");
      await refreshTournamentCard(tid, container);
    } catch (e) {
      m.scoreA = prevState.scoreA; m.scoreB = prevState.scoreB;
      m.penaltyA = prevState.penaltyA; m.penaltyB = prevState.penaltyB;
      btn.disabled = false;
      showToast("Couldn't save: " + (e.message || "connection error"), "error");
    }
  }

  function computeGoldenBoot(data) {
    if (data.format !== "single" || !data.participants) return null;
    const stats = {};
    data.participants.forEach(p => { stats[p.name] = { goals: 0, matches: 0, gf: 0, ga: 0 }; });

    let matchList = [];
    if (data.finalScore) matchList.push({ sideA: data.participants[0].name, sideB: data.participants[1].name, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
    if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
    if (data.knockout) data.knockout.stages.forEach(stage => { matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

    matchList.forEach(m => {
      if (stats[m.sideA]) { stats[m.sideA].goals += m.scoreA; stats[m.sideA].matches++; stats[m.sideA].gf += m.scoreA; stats[m.sideA].ga += m.scoreB; }
      if (stats[m.sideB]) { stats[m.sideB].goals += m.scoreB; stats[m.sideB].matches++; stats[m.sideB].gf += m.scoreB; stats[m.sideB].ga += m.scoreA; }
    });

    const entries = Object.entries(stats).map(([name, s]) => ({ name, goals: s.goals, matches: s.matches, gd: s.gf - s.ga }));
    if (entries.length === 0 || entries.every(e => e.goals === 0)) return null;
    entries.sort((a, b) => b.goals - a.goals || a.matches - b.matches || b.gd - a.gd);
    return entries[0];
  }

  function animateNumber(el, to, duration) {
    if (!el) return;
    duration = duration || 600;
    const start = performance.now();
    function step(now) {
      const progress = Math.min((now - start) / duration, 1);
      el.textContent = Math.round(progress * to);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

        const aWon = decided && (wentToPens ? m.penaltyA > m.penaltyB : m.scoreA > m.scoreB);

          (wentToPens ? `<div style="font-size:10px; text-align:center; color:var(--text-muted);">${m.penaltyA}-${m.penaltyB} pens</div>` : "");
        col.appendChild(box);

        }
      });
      columns.appendChild(col);
    });
    wrap.appendChild(columns);

  }

  async function computeHeadToHead(idA, idB) {
    const resultsSnap = await getDocs(query(collection(db, "resultsTable"), where("format", "==", "single")));
    const stats = { matches: 0, winsA: 0, winsB: 0, goalsA: 0, goalsB: 0 };

    for (const resultDoc of resultsSnap.docs) {
      const tSnap = await getDoc(doc(db, "tournaments", resultDoc.id));
      if (!tSnap.exists()) continue;
      const data = tSnap.data();

      let matchList = [];
      if (data.finalScore) matchList.push({ sideA: data.participants[0].name, sideB: data.participants[1].name, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
      if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout) data.knockout.stages.forEach(stage => { matchList = matchList.concat(stage.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

      matchList.forEach(m => {
        const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
        if (!refA || !refB) return;
        let sA, sB;
        if (refA.id === idA && refB.id === idB) { sA = m.scoreA; sB = m.scoreB; }
        else if (refA.id === idB && refB.id === idA) { sA = m.scoreB; sB = m.scoreA; }
        else return;
        stats.matches++;
        stats.goalsA += sA; stats.goalsB += sB;
        if (sA > sB) stats.winsA++; else if (sB > sA) stats.winsB++;
      });
    }
    return stats;
  }

  /* Compute 6 Dynamic Player Attributes for Hex Radar (Scale: 50 - 99) */
  function computePlayerRadarAttributes(p, recentFormList) {
    const matches = num(p.singleMatchesPlayed);
    const wins = num(p.singleWins);
    const gf = num(p.singleGoalsFor);
    const ga = num(p.singleGoalsAgainst);
    
    // Only Single and Tag Multi count towards Pedigree
    const totalTitles = num(p.singleChampionships) + num(p.tagMultiChampionships);

    const avgGf = matches > 0 ? (gf / matches) : 1.6;
    const att = Math.min(99, Math.max(50, Math.round(52 + (avgGf * 15))));

    const avgGa = matches > 0 ? (ga / matches) : 2.0;
    const def = Math.min(99, Math.max(50, Math.round(98 - (avgGa * 15))));

    const winRate = matches > 0 ? (wins / matches) : 0.5;
    const clu = Math.min(99, Math.max(50, Math.round(55 + (winRate * 28) + (num(p.singleChampionships) * 2.5))));

    const avgGd = matches > 0 ? ((gf - ga) / matches) : 0;
    const dom = Math.min(99, Math.max(50, Math.round(70 + (avgGd * 9))));

    const ped = Math.min(99, Math.max(50, Math.round(62 + (totalTitles * 6.5))));

    let formScore = 72;
    if (recentFormList && recentFormList.length > 0) {
      recentFormList.forEach(r => {
        if (r.result === "W") formScore += 5.5;
        else if (r.result === "D") formScore += 1.5;
        else if (r.result === "L") formScore -= 4.5;
      });
    }
    const frm = Math.min(99, Math.max(50, Math.round(formScore)));

    return { ATT: att, DEF: def, CLU: clu, DOM: dom, PED: ped, FRM: frm };
  }

  /* Render Hexagonal Radar Spider Chart on Canvas */
  function drawHexagonalRadar(canvas, attributes) {
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    const cx = width / 2;
    const cy = height / 2 + 6;
    const maxRadius = Math.min(cx, cy) - 46;

    const labels = ["ATT", "DEF", "CLU", "DOM", "PED", "FRM"];
    const values = [attributes.ATT, attributes.DEF, attributes.CLU, attributes.DOM, attributes.PED, attributes.FRM];
    const numAxes = labels.length;
    const angleStep = (Math.PI * 2) / numAxes;

    let animProgress = 0;
    const startTime = performance.now();
    const duration = 750;

    function render(now) {
      animProgress = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - animProgress, 3);

      ctx.clearRect(0, 0, width, height);

      // Concentric hexagonal grid
      const levels = [0.33, 0.66, 1.0];
      levels.forEach(lvl => {
        ctx.beginPath();
        for (let i = 0; i < numAxes; i++) {
          const a = (i * angleStep) - (Math.PI / 2);
          const r = maxRadius * lvl;
          const x = cx + r * Math.cos(a);
          const y = cy + r * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = lvl === 1.0 ? "rgba(255, 255, 255, 0.22)" : "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = lvl === 1.0 ? 1.5 : 1;
        ctx.stroke();
      });

      // Spoke lines
      for (let i = 0; i < numAxes; i++) {
        const a = (i * angleStep) - (Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + maxRadius * Math.cos(a), cy + maxRadius * Math.sin(a));
        ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Animated polygon
      ctx.beginPath();
      for (let i = 0; i < numAxes; i++) {
        const a = (i * angleStep) - (Math.PI / 2);
        const normVal = (values[i] / 100) * ease;
        const r = maxRadius * normVal;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxRadius);
      grad.addColorStop(0, "rgba(0, 230, 118, 0.55)");
      grad.addColorStop(0.7, "rgba(0, 229, 255, 0.28)");
      grad.addColorStop(1, "rgba(0, 229, 255, 0.05)");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = "#00e676";
      ctx.lineWidth = 2.5;
      ctx.shadowColor = "#00e676";
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Vertices & text
      for (let i = 0; i < numAxes; i++) {
        const a = (i * angleStep) - (Math.PI / 2);
        const normVal = (values[i] / 100) * ease;
        const r = maxRadius * normVal;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);

        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        const labelR = maxRadius + 22;
        const lx = cx + labelR * Math.cos(a);
        const ly = cy + labelR * Math.sin(a);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "800 11px monospace";
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fillText(labels[i], lx, ly - 6);

        ctx.font = "900 13px monospace";
        ctx.fillStyle = "#00e676";
        const animatedVal = Math.round(values[i] * ease);
        ctx.fillText(animatedVal, lx, ly + 8);
      }

      if (animProgress < 1) requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }

  async function loadRecentFormAndDrawRadar(p, playerId) {
    const row = document.getElementById("recentFormRow");
    const snap = await getDocs(query(collection(db, "tournaments"), where("format", "==", "single"), where("status", "==", "completed")));
    const tournaments = [];
    snap.forEach(d => tournaments.push(d.data()));
    tournaments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

    const results = [];
    tournaments.forEach(data => {
      let matchList = [];
      if (data.finalScore) matchList.push({ sideA: data.participants[0].name, sideB: data.participants[1].name, scoreA: data.finalScore.side1, scoreB: data.finalScore.side2 });
      if (data.matches) matchList = matchList.concat(data.matches.filter(m => m.scoreA !== null && m.scoreB !== null));
      if (data.knockout) data.knockout.stages.forEach(st => { matchList = matchList.concat(st.matches.filter(m => m.scoreA !== null && m.scoreB !== null)); });

      matchList.forEach(m => {
        const refA = sideRef(data, m.sideA)[0], refB = sideRef(data, m.sideB)[0];
        let mine = null, opp = null;
        if (refA && refA.id === playerId) { mine = m.scoreA; opp = m.scoreB; }
        else if (refB && refB.id === playerId) { mine = m.scoreB; opp = m.scoreA; }
        else return;
        results.push({ result: mine > opp ? "W" : (mine < opp ? "L" : "D") });
      });
    });

    const last5 = results.slice(-5);
    if (row) {
      if (last5.length === 0) {
        row.innerHTML = "<span class='status-msg'>No single player matches yet.</span>";
      } else {
        const colors = { W: "#2ecc71", L: "#e74c3c", D: "#999" };
        row.innerHTML = last5.map(r => `<span style="width:26px; height:26px; border-radius:50%; background:${colors[r.result]}; color:white; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;">${r.result}</span>`).join("");
