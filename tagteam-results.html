<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Tracker - Tag-team results</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  h2 { font-size: 15px; margin-top: 24px; color: #444; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  th { color: #777; font-weight: normal; }
</style>
</head>
<body>

<h1>Tag-team results</h1>

<h2>Regular controller</h2>
<table>
  <thead><tr><th>Tournament</th><th>Winner</th><th>Runner-up</th></tr></thead>
  <tbody id="regularBody"></tbody>
</table>

<h2>Multiple controller</h2>
<table>
  <thead><tr><th>Tournament</th><th>Winner</th><th>Runner-up</th></tr></thead>
  <tbody id="multiBody"></tbody>
</table>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp6Gyu5Se4uusmDR-qUi7HObPUvcLt32E",
    authDomain: "fcps5-tracker.firebaseapp.com",
    projectId: "fcps5-tracker",
    storageBucket: "fcps5-tracker.firebasestorage.app",
    messagingSenderId: "665004331085",
    appId: "1:665004331085:web:465607725bfda0068f8c04",
    measurementId: "G-DF7DCZ717Z"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadTable(subMode, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    const q = query(collection(db, "resultsTable"),
      where("format", "==", "tagteam"),
      where("subMode", "==", subMode),
      orderBy("completedAt", "desc"));
    const snap = await getDocs(q);
    tbody.innerHTML = "";
    snap.forEach((d) => {
      const r = d.data();
      const row = document.createElement("tr");
      row.innerHTML = "<td>" + r.tournamentName + "</td><td>" + r.winner + "</td><td>" + r.runnerUp + "</td>";
      tbody.appendChild(row);
    });
    if (snap.empty) {
      tbody.innerHTML = '<tr><td colspan="3">No completed tournaments yet.</td></tr>';
    }
  }

  loadTable("regular", "regularBody");
  loadTable("multi", "multiBody");
</script>

</body>
</html>
